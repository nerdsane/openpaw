[build]
builder = "nixpacks"
buildCommand = "cd dashboard && npm install && npm run build && cd .. && cargo build --release"

[deploy]
startCommand = "./target/release/openpaw"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.volumes]
data = "/root/.local/share/openpaw"

# DsfWorkCycle — Merged harness + work cycle for deep-sci-fi development governance.
# Combines Harness setup (Configure, Activate) with a governed implementation
# loop (CreateWorkCycle → Planning → ... → Complete) and 3-level gate verification.

[automaton]
name = "DsfWorkCycle"
states = ["Created", "Configured", "Active", "Planning", "Planned", "InProgress", "Testing", "Reviewing", "Complete", "Failed"]
initial = "Created"

# ============================================================
# Harness fields
# ============================================================

[[state]]
name = "repo_url"
type = "string"
initial = ""

[[state]]
name = "tech_stack"
type = "string"
initial = ""

[[state]]
name = "conventions"
type = "string"
initial = ""

[[state]]
name = "last_activated_at"
type = "string"
initial = ""

# ============================================================
# Work cycle fields
# ============================================================

[[state]]
name = "task_summary"
type = "string"
initial = ""

[[state]]
name = "planner_id"
type = "string"
initial = ""

[[state]]
name = "approver_id"
type = "string"
initial = ""

[[state]]
name = "plan_summary"
type = "string"
initial = ""

[[state]]
name = "test_summary"
type = "string"
initial = ""

[[state]]
name = "pr_url"
type = "string"
initial = ""

[[state]]
name = "error_message"
type = "string"
initial = ""

[[state]]
name = "sandbox_url"
type = "string"
initial = ""

[[state]]
name = "review_notes"
type = "string"
initial = ""

# ============================================================
# Gate fields (boolean)
# ============================================================

[[state]]
name = "has_plan"
type = "bool"
initial = "false"

[[state]]
name = "migrations_ok"
type = "bool"
initial = "false"

[[state]]
name = "typecheck_ok"
type = "bool"
initial = "false"

[[state]]
name = "unit_tests_ok"
type = "bool"
initial = "false"

[[state]]
name = "dst_ok"
type = "bool"
initial = "false"

[[state]]
name = "policy_gates_ok"
type = "bool"
initial = "false"

[[state]]
name = "e2e_ok"
type = "bool"
initial = "false"

[[state]]
name = "tests_passed"
type = "bool"
initial = "false"

# ============================================================
# Gate report summary fields
# ============================================================

[[state]]
name = "migrations_summary"
type = "string"
initial = ""

[[state]]
name = "typecheck_summary"
type = "string"
initial = ""

[[state]]
name = "unit_tests_summary"
type = "string"
initial = ""

[[state]]
name = "dst_summary"
type = "string"
initial = ""

[[state]]
name = "policy_gates_summary"
type = "string"
initial = ""

[[state]]
name = "e2e_summary"
type = "string"
initial = ""

# ============================================================
# Harness setup actions
# ============================================================

[[action]]
name = "Configure"
kind = "input"
from = ["Created", "Configured"]
to = "Configured"
params = ["repo_url", "tech_stack", "conventions"]
hint = "Attach repository metadata and working conventions before the harness goes live."

[[action]]
name = "Activate"
kind = "input"
from = ["Configured"]
to = "Active"
params = ["last_activated_at"]
hint = "Turn on the harness after the repository contract is configured."

# ============================================================
# Work cycle initiation
# ============================================================

[[action]]
name = "CreateWorkCycle"
kind = "input"
from = ["Active"]
to = "Planning"
params = ["task_summary", "planner_id"]
hint = "Start a new work cycle within the active harness. Sets the task and planner."

# ============================================================
# Planning and implementation actions
# ============================================================

[[action]]
name = "WritePlan"
kind = "input"
from = ["Planning"]
to = "Planned"
params = ["plan_summary", "planner_id"]
effect = "set has_plan true"
hint = "Draft the plan before implementation can begin."

[[action]]
name = "StartWork"
kind = "input"
from = ["Planned"]
to = "InProgress"
guard = "is_true has_plan"
hint = "Start implementation only after a plan exists."

[[action]]
name = "UpdateSandbox"
kind = "input"
from = ["InProgress"]
params = ["sandbox_url"]
hint = "Record the sandbox URL of the SWE agent working on this cycle."

# ============================================================
# Gate report actions (self-loops in InProgress)
# ============================================================

[[action]]
name = "ReportMigrations"
kind = "input"
from = ["InProgress"]
params = ["migrations_ok", "migrations_summary"]
hint = "Report whether Alembic migration check passed or failed."

[[action]]
name = "ReportTypecheck"
kind = "input"
from = ["InProgress"]
params = ["typecheck_ok", "typecheck_summary"]
hint = "Report whether TypeScript/Python type check passed or failed."

[[action]]
name = "ReportUnitTests"
kind = "input"
from = ["InProgress"]
params = ["unit_tests_ok", "unit_tests_summary"]
hint = "Report whether pytest + vitest unit tests passed or failed."

[[action]]
name = "ReportDst"
kind = "input"
from = ["InProgress", "Testing"]
params = ["dst_ok", "dst_summary"]
hint = "Report whether Hypothesis DST simulation tests passed or failed."

[[action]]
name = "ReportPolicyGates"
kind = "input"
from = ["InProgress", "Testing"]
params = ["policy_gates_ok", "policy_gates_summary"]
hint = "Report whether all Level 1 + Level 2 policy gate checks passed or failed."

[[action]]
name = "ReportE2e"
kind = "input"
from = ["InProgress", "Testing"]
params = ["e2e_ok", "e2e_summary"]
hint = "Report whether Playwright E2E tests passed or failed. Optional gate."

# ============================================================
# Testing and review transition actions
# ============================================================

[[action]]
name = "BeginTesting"
kind = "input"
from = ["InProgress"]
to = "Testing"
guard = [
  { type = "is_true", var = "migrations_ok" },
  { type = "is_true", var = "typecheck_ok" },
  { type = "is_true", var = "unit_tests_ok" }
]
hint = "Move to testing only after migrations, typecheck, and unit tests are green."

  [[action.integration]]
  wasm = "wasm/gate_verifier"
  on = "effect"
  config = { gate_level = "1" }
  on_failure = "Fail"

[[action]]
name = "PassTests"
kind = "input"
from = ["Testing"]
to = "Reviewing"
params = ["test_summary"]
effect = "set tests_passed true"
guard = [
  { type = "is_true", var = "dst_ok" },
  { type = "is_true", var = "policy_gates_ok" }
]
hint = "Only passing work should enter review. DST and policy gates must be green."

  [[action.integration]]
  wasm = "wasm/gate_verifier"
  on = "effect"
  config = { gate_level = "2" }
  on_failure = "Fail"

[[action]]
name = "Approve"
kind = "input"
from = ["Reviewing"]
to = "Complete"
guard = "is_true tests_passed"
params = ["approver_id", "pr_url"]
hint = "Approve the reviewed change after all tests have passed."

[[action]]
name = "RequestChanges"
kind = "input"
from = ["Reviewing"]
to = "Planning"
params = ["review_notes"]
effect = "set tests_passed false"
hint = "Send work back for changes. Resets tests_passed so gates must be re-verified."

[[action]]
name = "Fail"
kind = "input"
from = ["Planning", "Planned", "InProgress", "Testing", "Reviewing"]
to = "Failed"
params = ["error_message"]
hint = "Record a failed work cycle with the reason for failure."

# ============================================================
# Invariants
# ============================================================

[[invariant]]
name = "PlannedWorkHasPlan"
when = ["Planned", "InProgress", "Testing", "Reviewing", "Complete"]
assert = "has_plan"

[[invariant]]
name = "TestingRequiresBaseGates"
when = ["Testing", "Reviewing", "Complete"]
assert = "migrations_ok && typecheck_ok && unit_tests_ok"

[[invariant]]
name = "ReviewRequiresDSTAndPolicy"
when = ["Reviewing", "Complete"]
assert = "dst_ok && policy_gates_ok"

[[invariant]]
name = "ReviewedWorkPassedTests"
when = ["Reviewing", "Complete"]
assert = "tests_passed"

[[invariant]]
name = "CompleteIsFinal"
when = ["Complete"]
assert = "no_further_transitions"

[[invariant]]
name = "FailedIsFinal"
when = ["Failed"]
assert = "no_further_transitions"

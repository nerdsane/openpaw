# DsfWorkCycle — Merged harness + work cycle for deep-sci-fi development governance.

[automaton]
name = "DsfWorkCycle"
states = ["Created", "Configured", "Active", "Planning", "Planned", "InProgress", "Testing", "Reviewing", "Complete", "Failed"]
initial = "Created"

# --- Harness fields ---

[[state]]
name = "repo_url"
type = "string"
initial = ""

[[state]]
name = "tech_stack"
type = "string"
initial = ""

[[state]]
name = "conventions"
type = "string"
initial = ""

[[state]]
name = "last_activated_at"
type = "string"
initial = ""

# --- Work cycle fields ---

[[state]]
name = "task_summary"
type = "string"
initial = ""

[[state]]
name = "planner_id"
type = "string"
initial = ""

[[state]]
name = "approver_id"
type = "string"
initial = ""

[[state]]
name = "plan_summary"
type = "string"
initial = ""

[[state]]
name = "test_summary"
type = "string"
initial = ""

[[state]]
name = "pr_url"
type = "string"
initial = ""

[[state]]
name = "error_message"
type = "string"
initial = ""

[[state]]
name = "sandbox_url"
type = "string"
initial = ""

[[state]]
name = "review_notes"
type = "string"
initial = ""

# --- Gate booleans ---

[[state]]
name = "has_plan"
type = "bool"
initial = "false"

[[state]]
name = "migrations_ok"
type = "bool"
initial = "false"

[[state]]
name = "typecheck_ok"
type = "bool"
initial = "false"

[[state]]
name = "unit_tests_ok"
type = "bool"
initial = "false"

[[state]]
name = "dst_ok"
type = "bool"
initial = "false"

[[state]]
name = "policy_gates_ok"
type = "bool"
initial = "false"

[[state]]
name = "e2e_ok"
type = "bool"
initial = "false"

[[state]]
name = "tests_passed"
type = "bool"
initial = "false"

# --- Harness setup actions ---

[[action]]
name = "Configure"
kind = "input"
from = ["Created", "Configured"]
to = "Configured"
params = ["repo_url", "tech_stack", "conventions"]
hint = "Attach repository metadata and working conventions."

[[action]]
name = "Activate"
kind = "input"
from = ["Configured"]
to = "Active"
params = ["last_activated_at"]
hint = "Turn on the harness."

# --- Work cycle start ---

[[action]]
name = "CreateWorkCycle"
kind = "input"
from = ["Active"]
to = "Planning"
params = ["task_summary", "planner_id"]
hint = "Start a work cycle within the active harness."

# --- Planning ---

[[action]]
name = "WritePlan"
kind = "input"
from = ["Planning"]
to = "Planned"
params = ["plan_summary"]
effect = "set has_plan true"
hint = "Draft the plan."

[[action]]
name = "StartWork"
kind = "input"
from = ["Planned"]
to = "InProgress"
guard = "is_true has_plan"
hint = "Start implementation."

[[action]]
name = "UpdateSandbox"
kind = "input"
from = ["InProgress"]
params = ["sandbox_url"]
hint = "Record SWE sandbox URL."

# --- Gate report actions (self-loops) ---

[[action]]
name = "ReportMigrations"
kind = "input"
from = ["InProgress"]
effect = "set migrations_ok true"
hint = "Record that migrations passed."

[[action]]
name = "ReportTypecheck"
kind = "input"
from = ["InProgress"]
effect = "set typecheck_ok true"
hint = "Record that typecheck passed."

[[action]]
name = "ReportUnitTests"
kind = "input"
from = ["InProgress"]
effect = "set unit_tests_ok true"
hint = "Record that unit tests passed."

[[action]]
name = "ReportDst"
kind = "input"
from = ["InProgress", "Testing"]
effect = "set dst_ok true"
hint = "Record that DST passed."

[[action]]
name = "ReportPolicyGates"
kind = "input"
from = ["InProgress", "Testing"]
effect = "set policy_gates_ok true"
hint = "Record that policy gates passed."

[[action]]
name = "ReportE2e"
kind = "input"
from = ["InProgress", "Testing"]
effect = "set e2e_ok true"
hint = "Record that E2E tests passed."

# --- Transitions ---

[[action]]
name = "BeginTesting"
kind = "input"
from = ["InProgress"]
to = "Testing"
guard = [
  { type = "is_true", var = "migrations_ok" },
  { type = "is_true", var = "typecheck_ok" },
  { type = "is_true", var = "unit_tests_ok" }
]
hint = "Move to testing. Requires L1 gates."

[[action]]
name = "PassTests"
kind = "input"
from = ["Testing"]
to = "Reviewing"
params = ["test_summary"]
effect = "set tests_passed true"
guard = [
  { type = "is_true", var = "dst_ok" },
  { type = "is_true", var = "policy_gates_ok" }
]
hint = "Enter review. Requires L2 gates."

[[action]]
name = "Approve"
kind = "input"
from = ["Reviewing"]
to = "Complete"
guard = "is_true tests_passed"
params = ["approver_id", "pr_url"]
hint = "Approve the change."

[[action]]
name = "RequestChanges"
kind = "input"
from = ["Reviewing"]
to = "InProgress"
params = ["review_notes"]
effect = "set tests_passed false"
hint = "Send back for changes. Resets tests_passed."

[[action]]
name = "Fail"
kind = "input"
from = ["Planning", "Planned", "InProgress", "Testing", "Reviewing"]
to = "Failed"
params = ["error_message"]
hint = "Record failure."

# --- Invariants ---

[[invariant]]
name = "PlannedWorkHasPlan"
when = ["Planned", "InProgress", "Testing", "Reviewing", "Complete"]
assert = "has_plan"

[[invariant]]
name = "ReviewedWorkPassedTests"
when = ["Reviewing", "Complete"]
assert = "tests_passed"

[[invariant]]
name = "CompleteIsFinal"
when = ["Complete"]
assert = "no_further_transitions"

[[invariant]]
name = "FailedIsFinal"
when = ["Failed"]
assert = "no_further_transitions"

# --- Integrations ---
# gate_verifier runs check commands in the SWE's sandbox.
# Wired as standalone triggers (BeginTesting and PassTests guards
# prevent inline effects on the same action).

[[integration]]
name = "verify_level1_gates"
trigger = "verify_level1_gates"
type = "wasm"
module = "gate_verifier"
on_failure = "Fail"

[integration.config]
temper_api_url = "{secret:temper_api_url}"
gate_level = "1"

[[integration]]
name = "verify_level2_gates"
trigger = "verify_level2_gates"
type = "wasm"
module = "gate_verifier"
on_failure = "Fail"

[integration.config]
temper_api_url = "{secret:temper_api_url}"
gate_level = "2"

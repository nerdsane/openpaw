# Deep-Sci-Fi Computer instance data.
# Applied via: POST /tdata/Computers → Configure → Activate

[instance]
id = "deep-sci-fi-dev"
entity_type = "Computer"

[fields]
name = "deep-sci-fi-dev"
description = "Development environment for deep-sci-fi agents"
base_image = "ubuntu-24.04"
cpu_cores = "2"
memory_gb = "4"
storage_gb = "100"
tools_installed = "gh,git,python3,bun,node,alembic"
credentials_scoped = "GITHUB_TOKEN"
network_allow = "github.com,api.github.com,*.deep-sci-fi.world,registry.npmjs.org,pypi.org"
project_harness_id = "deep-sci-fi"
setup_script = """
# Install gh CLI
curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list
apt-get update && apt-get install -y gh
"""

[package]
name = "openpaw"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Open Paw — Agent daemon built on Temper platform"

[[bin]]
name = "openpaw"
path = "src/main.rs"

[dependencies]
# Temper platform engine
temper-platform = { git = "https://github.com/nerdsane/temper.git", branch = "main" }
temper-observe = { git = "https://github.com/nerdsane/temper.git", branch = "main" }
temper-server = { git = "https://github.com/nerdsane/temper.git", branch = "main", features = ["observe"] }
temper-runtime = { git = "https://github.com/nerdsane/temper.git", branch = "main" }
temper-jit = { git = "https://github.com/nerdsane/temper.git", branch = "main" }
temper-authz = { git = "https://github.com/nerdsane/temper.git", branch = "main" }
temper-store-turso = { git = "https://github.com/nerdsane/temper.git", branch = "main" }

# Paw transport (local)
paw-transport = { path = "../paw-transport" }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP server
axum = { workspace = true }

# Logging & Observability
tracing = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Local environment loading
dotenvy = "0.15"

# Crypto / encoding (for vault key)
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
rand = "0.9"
sha2 = "0.10"
urlencoding = "2.1"

# Static file serving (dashboard UI)
tower-http = { version = "0.6", features = ["fs"] }

# HTTP client (for soul bootstrap OData calls)
reqwest = { version = "0.12", features = ["json"] }

# Transport manager (cancellation tokens)
tokio-util = "0.7"

# UUID generation for agent IDs
uuid = { version = "1", features = ["v4"] }

# CLI subcommands
clap = { version = "4", features = ["derive"] }

# Beautiful TUI prompts (Rust port of @clack/prompts)
cliclack = "0.3"

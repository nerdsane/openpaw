[package]
name = "openpaw"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Open Paw — Agent daemon built on Temper platform"

[[bin]]
name = "openpaw"
path = "src/main.rs"

[dependencies]
# Temper platform engine (git dependency)
temper-platform = { git = "https://github.com/nerdsane/temper.git", branch = "feat/temper-claw" }
temper-server = { git = "https://github.com/nerdsane/temper.git", branch = "feat/temper-claw", features = ["observe"] }
temper-runtime = { git = "https://github.com/nerdsane/temper.git", branch = "feat/temper-claw" }
temper-jit = { git = "https://github.com/nerdsane/temper.git", branch = "feat/temper-claw" }
temper-authz = { git = "https://github.com/nerdsane/temper.git", branch = "feat/temper-claw" }
temper-store-turso = { git = "https://github.com/nerdsane/temper.git", branch = "feat/temper-claw" }

# Paw transport (local)
paw-transport = { path = "../paw-transport" }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP server
axum = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Local environment loading
dotenvy = "0.15"

# Crypto / encoding (for vault key)
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
rand = "0.9"
sha2 = "0.10"
urlencoding = "2.1"

# HTTP client (for soul bootstrap OData calls)
reqwest = { version = "0.12", features = ["json"] }

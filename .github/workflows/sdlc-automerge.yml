# Auto-merge router: the tier logic from autonomy.yaml, applied. Runs after the
# gate workflows complete. Auto-merges a low-risk PR whose gates are all green;
# elevates anything else to human. Every PR keeps its proof + review either way.
# Vendor as .github/workflows/sdlc-automerge.yml.
name: sdlc-automerge
on:
  # check_suite is NOT delivered for suites created by GitHub Actions, so the
  # router listens for the gate workflows themselves completing instead.
  workflow_run:
    workflows: [sdlc-planning, sdlc-decisions, sdlc-verification, sdlc-review]
    types: [completed]
  pull_request:
    types: [labeled]     # allow a human 'human-hold' label to veto
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read
jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch autonomy config from stack
        env:
          STACK_TOKEN: ${{ secrets.STACK_TOKEN }}
        run: git clone --depth 1 https://x-access-token:${STACK_TOKEN}@github.com/arni-labs/stack /tmp/stack || exit 1
      - name: Decide and route
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # router has no checkout: every gh command needs the repo
          GH_REPO_FULL: ${{ github.repository }}
          # the PR this event belongs to - never "the first open PR in the repo".
          # workflow_run carries the head sha; labeled carries the PR directly.
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.workflow_run.head_sha }}
          PR_GH_AUTHOR_LABELED: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          NUM="${EVENT_PR:-}"
          if [ -z "$NUM" ] && [ -n "${EVENT_HEAD:-}" ]; then
            # resolve the open PR whose head is this workflow_run's head sha
            NUM=$(gh pr list --state open --json number,headRefOid \
                    -q "[.[] | select(.headRefOid == \"$EVENT_HEAD\")][0].number" || true)
          fi
          [ -z "$NUM" ] || [ "$NUM" = "null" ] && { echo "no open PR for this event"; exit 0; }
          HEAD=$(gh pr view "$NUM" --json headRefOid -q .headRefOid)
          BASE=$(gh pr view "$NUM" --json baseRefName -q .baseRefName)
          BRANCH=$(gh pr view "$NUM" --json headRefName -q .headRefName)
          STATE=$(gh pr view "$NUM" --json state -q .state)
          [ "$STATE" = "OPEN" ] || { echo "PR #$NUM is $STATE - nothing to route"; exit 0; }
          # authoring harness, from the branch naming convention (<agent>/<task>)
          case "${BRANCH%%/*}" in
            claude|codex|grok|cursor) AUTHOR="${BRANCH%%/*}" ;;
            *) AUTHOR="unknown" ;;
          esac
          PR_GH_AUTHOR=$(gh pr view "$NUM" --json author -q .author.login)
          export PR_GH_AUTHOR

          # human veto label always wins; an unreadable label list fails CLOSED
          # (a gh error must never read as "no veto")
          if ! LABELS=$(gh pr view "$NUM" --json labels -q '.labels[].name'); then
            echo "could not read labels - cannot rule out a human veto, not routing"; exit 0; fi
          if grep -qx human-hold <<<"$LABELS"; then
            # the veto also cancels an auto-merge that an earlier run already enabled
            gh pr merge "$NUM" --disable-auto 2>/dev/null || true
            echo "human-hold label present - auto-merge disabled, leaving for human"; exit 0; fi

          # autonomy config: the GLOBAL config from the stack is authoritative; a
          # repo override is read from the BASE branch (never the PR head, which
          # the author controls) and can only make it stricter.
          python3 -m pip install --quiet pyyaml 2>/dev/null || true
          # absent override (404) is fine; a FAILED fetch is not knowable and fails closed
          RC=0
          gh api "repos/${GH_REPO_FULL}/contents/.github/autonomy.yaml?ref=${BASE}" \
            -q .content > /tmp/override.b64 2>/tmp/override.err || RC=$?
          if [ "$RC" -eq 0 ]; then
            base64 -d < /tmp/override.b64 > /tmp/repo-autonomy.yaml
          elif grep -q "Not Found" /tmp/override.err; then
            : > /tmp/repo-autonomy.yaml   # no override defined - global applies
          else
            echo "could not read the base-branch autonomy override - routing to human"; \
            gh pr edit "$NUM" --add-label human-review 2>/dev/null || true; exit 0
          fi
          AUTO_ENABLED=$(python3 - <<'PY'
          import os
          try:
              import yaml
              def enabled(path):
                  # None = no config at this layer; True/False = its verdict
                  if not os.path.exists(path) or os.path.getsize(path) == 0:
                      return None
                  conf = yaml.safe_load(open(path)) or {}
                  am = (conf.get("tiers") or {}).get("auto_merge") or {}
                  return am.get("enabled") is not False
              g = enabled("/tmp/stack/autonomy.yaml")
              r = enabled("/tmp/repo-autonomy.yaml")
              # stricter-only: auto-merge needs the global to allow it AND the
              # repo override (when present) not to disable it
              print("true" if (g and (r is None or r)) else "false")
          except Exception:
              print("false")   # unreadable config -> strictest interpretation
          PY
          )
          echo "auto_merge enabled (global AND base-branch override): $AUTO_ENABLED"

          # critical paths from the config elevate to human regardless of risk
          if ! gh pr diff "$NUM" --name-only > /tmp/pr-files.txt; then
            echo "could not read the PR diff - cannot clear critical paths, routing to human"
            gh pr edit "$NUM" --add-label human-review 2>/dev/null || true; exit 0
          fi
          CRITICAL=$(python3 - <<'PY'
          import re
          raw = []
          try:
              import yaml
              for path in ("/tmp/stack/autonomy.yaml", "/tmp/repo-autonomy.yaml"):
                  try:
                      conf = yaml.safe_load(open(path)) or {}
                  except FileNotFoundError:
                      continue
                  # the repo override ADDS critical paths (stricter-only), never removes
                  raw += conf.get("critical_paths") or []
          except Exception:
              raw = []
          # entries are keyword groups like "security / cedar policies": split on
          # '/' AND whitespace so "cedar policies" matches cedar- or policy-paths,
          # not only the literal two-word substring
          words = {w.strip().lower()
                   for entry in raw
                   for part in str(entry).split("/")
                   for w in part.split()
                   if w.strip()}
          # match singular and plural forms both ways ("policies" must catch
          # policy.cedar; "migration" must catch migrations/)
          stems = {w[:-1] if w.endswith("s") else w for w in words} | words
          files = open("/tmp/pr-files.txt").read().lower().splitlines()
          hits = sorted({w for w in stems for f in files if len(w) > 3 and w in f})
          print(",".join(hits) if hits else "none")
          PY
          )
          if [ "$CRITICAL" != "none" ]; then
            gh pr edit "$NUM" --add-label human-review 2>/dev/null || true
            gh pr comment "$NUM" --body "Elevated to human review: touches critical paths (**$CRITICAL**, per autonomy.yaml). Gates still apply; a human presses merge."
            exit 0
          fi

          # ALL required gate checks must EXIST and have SUCCEEDED on the current
          # head. An empty or errored rollup is not green - it routes nowhere.
          gh pr view "$NUM" --json statusCheckRollup -q '.statusCheckRollup' > /tmp/rollup.json
          GATES_OK=$(python3 - <<'PY'
          import json
          required = {"planning", "decision-log", "proof", "review"}
          rollup = json.load(open("/tmp/rollup.json")) or []
          state = {}
          for c in rollup:
              name = c.get("name") or c.get("context") or ""
              concl = (c.get("conclusion") or c.get("state") or "").upper()
              if name in required:
                  state[name] = concl
          missing = required - set(state)
          bad = {n: c for n, c in state.items() if c != "SUCCESS"}
          print("true" if not missing and not bad else f"false missing={sorted(missing)} bad={bad}")
          PY
          )
          if [ "${GATES_OK%% *}" != "true" ]; then
            echo "gates not all green on head ($GATES_OK) - not routing"; exit 0; fi

          # risk comes from the REVIEW PANEL's judgment, and ONLY from a record
          # that validates against THIS head with a non-author synthesis - the
          # same bar the review gate applies. Open act-on findings or a missing/
          # unvalidated record read as high (human).
          RISK=$(python3 - "$NUM" "$HEAD" "$AUTHOR" <<'PY'
          import json, re, subprocess, sys
          num, head, author = sys.argv[1:4]
          import os
          repo = os.environ["GH_REPO_FULL"]
          pr_author = os.environ.get("PR_GH_AUTHOR","").lower()
          out = subprocess.run(["gh","api",f"repos/{repo}/issues/{num}/comments","--paginate",
                                "-q",'.[] | {assoc: .author_association, login: .user.login, body: .body}'],
                               capture_output=True, text=True).stdout
          # same trust bar as the review gate: trusted association AND a
          # non-author account. Risk is the MOST CONSERVATIVE across every valid
          # record, so a later forged "low" cannot replace the accepted judgment.
          RANK = {"low": 0, "medium": 1, "high": 2}
          risks = []
          for line in out.splitlines():
              try: c = json.loads(line)
              except Exception: continue
              if c.get("assoc") not in ("OWNER","MEMBER","COLLABORATOR"):
                  continue
              if c.get("login","").lower() == pr_author:
                  continue
              for m in re.finditer(r"<!--\s*sdlc-review-record\s*(\{.*?\})\s*-->", c.get("body",""), re.S):
                  try: rec = json.loads(m.group(1))
                  except Exception: continue
                  open("/tmp/automerge-record.json","w").write(json.dumps(rec))
                  ok = subprocess.run(["python3","/tmp/stack/review/validate.py","/tmp/automerge-record.json",
                                       "--require-commit", head, "--author", author],
                                      capture_output=True).returncode == 0
                  if not ok: continue
                  opens = [f for f in rec.get("findings",[]) if f.get("severity")=="act-on" and not f.get("resolved")]
                  r = rec.get("risk","high") if not opens else "high"
                  risks.append(r if r in RANK else "high")
          risk = max(risks, key=lambda r: RANK[r]) if risks else "high"
          print(risk)
          PY
          )
          echo "panel risk (validated record only): $RISK"
          if [ "$RISK" = "low" ] && [ "$AUTO_ENABLED" = "true" ]; then
            # close the race: the head must still be the sha every check above
            # validated, and the human veto must not have appeared meanwhile
            NOW_HEAD=$(gh pr view "$NUM" --json headRefOid -q .headRefOid)
            if [ "$NOW_HEAD" != "$HEAD" ]; then
              echo "head moved (${HEAD:0:8} -> ${NOW_HEAD:0:8}) since validation - not merging"; exit 0; fi
            if gh pr view "$NUM" --json labels -q '.labels[].name' | grep -qx human-hold; then
              gh pr merge "$NUM" --disable-auto 2>/dev/null || true
              echo "human-hold appeared during routing - not merging"; exit 0; fi
            gh pr merge "$NUM" --squash --auto && \
              gh pr comment "$NUM" --body "Auto-merged: all required gates green on this head, panel risk low, no critical paths (per autonomy.yaml). Proof + review are on this PR."
          else
            # a previous routing run may have enabled auto-merge on an older
            # head; GitHub keeps it armed across pushes, so revoke it whenever
            # the current judgment is not auto-merge
            gh pr merge "$NUM" --disable-auto 2>/dev/null || true
            gh pr edit "$NUM" --add-label human-review 2>/dev/null || true
            gh pr comment "$NUM" --body "Elevated to human review: panel risk **$RISK**$([ "$AUTO_ENABLED" = "true" ] || echo ' (auto-merge disabled for this repo)'). Gates are green; a human presses merge."
          fi

# Stage-3 S1 shadow sweep (ARN-431, extended to two repos in ARN-438). SHADOW
# ONLY: never blocks a merge, never writes to GitHub. It records ShadowVerdict
# rows in prod Temper comparing the state machine's per-gate verdict against CI's,
# and prints a disagreement table. The sweep script lives in stack
# (shadow/shadow-sweep.py) and is cloned here the same way the gates fetch stack.
#
# ONE workflow, TWO repos: a matrix sweeps both nerdsane/temperpaw and
# nerdsane/temper. temper is the kernel this app pins; its PRs get the same shadow
# coverage. The sweep mints repo-qualified entity ids (sv-<slug>-prN-gate) so the
# two repos' PR-number spaces never collide in prod Temper.
#
# Cross-repo reads need a token that can see BOTH repos: GITHUB_TOKEN is scoped to
# this repo only, so every git/gh call here uses STACK_TOKEN (a rita-aga PAT).
name: shadow-sweep
on:
  schedule:
    - cron: "0 7 * * *"   # nightly (07:00 UTC) - sweeps BOTH repos' windows
  workflow_dispatch:
    inputs:
      repo:
        description: "Which repo to sweep"
        type: choice
        options: [both, temperpaw, temper]
        default: both
      pr_numbers:
        description: "Space/comma-separated PR numbers (requires a single repo; blank = window)"
        required: false
        default: ""
permissions:
  # Everything here authenticates with STACK_TOKEN (needs to read both repos), so
  # the default GITHUB_TOKEN is effectively unused. Keep contents:read only.
  contents: read
jobs:
  shadow-sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one repo's sweep failing must not abort the other
      matrix:
        repo: [nerdsane/temperpaw, nerdsane/temper]
    steps:
      - name: Checkout the swept repo (so the mirror scripts have its tree)
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.STACK_TOKEN }}   # GITHUB_TOKEN can't read the other repo
          fetch-depth: 1
      - name: Fetch the sweep from stack
        env:
          STACK_TOKEN: ${{ secrets.STACK_TOKEN }}
        run: |
          if [ -z "${STACK_TOKEN:-}" ]; then
            echo "::error::STACK_TOKEN unavailable - the shadow sweep needs the stack script"; exit 1; fi
          git clone --depth 1 https://x-access-token:${STACK_TOKEN}@github.com/arni-labs/stack /tmp/stack || {
            echo "::error::cannot reach arni-labs/stack"; exit 1; }
      - name: Resolve the PR window
        id: window
        env:
          GH_TOKEN: ${{ secrets.STACK_TOKEN }}   # reads PRs/check-runs in EITHER repo
          MATRIX_REPO: ${{ matrix.repo }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO: ${{ github.event.inputs.repo }}
          INPUT_PRS: ${{ github.event.inputs.pr_numbers }}
        run: |
          set -euo pipefail
          SHORT="${MATRIX_REPO##*/}"

          emit_prs() {   # write the (possibly empty) list via a heredoc delimiter
            {
              echo "prs<<SHADOW_PRS_EOF"
              echo "$1"
              echo "SHADOW_PRS_EOF"
            } >> "$GITHUB_OUTPUT"
          }

          # On a targeted manual dispatch, skip the legs that were not selected.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_REPO:-}" ] \
             && [ "$INPUT_REPO" != "both" ] && [ "$INPUT_REPO" != "$SHORT" ]; then
            echo "dispatch targets '$INPUT_REPO', not $SHORT - skipping this leg."
            emit_prs ""; exit 0
          fi

          # Explicit PR numbers only make sense for a single repo (else ambiguous
          # which repo owns the numbers).
          if [ -n "${INPUT_PRS:-}" ] \
             && { [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "${INPUT_REPO:-both}" = "both" ]; }; then
            echo "::error::pr_numbers requires selecting a single repo (repo must be temperpaw or temper)"; exit 1
          fi

          # Validate the dispatch input PER TOKEN, split with read -ra (no glob,
          # no word-split surprises). Each token must be 1-6 digits, else fail
          # loudly - never sanitize-by-deletion, which could concatenate "12;34"
          # into a different valid PR number.
          IFS=$', \t\n' read -ra toks <<< "${INPUT_PRS:-}"
          input_prs=""
          for tok in "${toks[@]}"; do
            [ -z "$tok" ] && continue
            case "$tok" in
              *[!0-9]*) echo "::error::invalid pr_numbers token '$tok' (expected 1-6 digits)"; exit 1 ;;
            esac
            if [ "${#tok}" -gt 6 ]; then echo "::error::pr_numbers token '$tok' too long"; exit 1; fi
            input_prs="${input_prs:+$input_prs }$tok"
          done

          if [ -n "$input_prs" ]; then
            prs="$input_prs"
          else
            # nightly (or a repo-only dispatch): PRs updated in the last ~48h - a
            # wide overlap so a skipped nightly leaves no coverage gap. Fetch
            # newest-updated first so --limit cannot drop in-window PRs before the
            # window filter runs, and warn loudly if the cap is hit.
            since=$(date -u -d '48 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-48H +%Y-%m-%dT%H:%M:%SZ)
            limit=200
            raw=$(gh pr list --repo "$MATRIX_REPO" --state all --limit "$limit" \
                  --search "sort:updated-desc" --json number,updatedAt) || {
                    echo "::error::gh pr list failed for $MATRIX_REPO"; exit 1; }
            total=$(printf '%s' "$raw" | jq 'length')
            prs=$(printf '%s' "$raw" | jq -r --arg since "$since" \
                  '[.[] | select(.updatedAt > $since) | .number] | join(" ")')
            if [ "$total" -ge "$limit" ]; then
              echo "::warning::gh pr list returned the full ${limit}-row cap for $MATRIX_REPO; in-window PRs may be truncated"
            fi
          fi
          emit_prs "$prs"
      - name: Run the shadow sweep (shadow only - never blocks)
        if: steps.window.outputs.prs != ''
        env:
          GH_TOKEN: ${{ secrets.STACK_TOKEN }}   # reads PRs/check-runs in EITHER repo
          TEMPER_API_KEY: ${{ secrets.TEMPER_API_KEY }}
          STACK_DIR: /tmp/stack
          SHADOW_REPO: ${{ matrix.repo }}
          # Passed via env (not a ${{ }} splice into the script) so the value is
          # data, never executable text.
          PRS: ${{ steps.window.outputs.prs }}
        run: |
          set -euo pipefail
          echo "Sweeping ${SHADOW_REPO}. Shadow only - never blocks, never writes to GitHub."
          EXTRA=""
          if [ -z "${TEMPER_API_KEY:-}" ]; then
            echo "::warning::TEMPER_API_KEY unavailable - printing verdicts without writing ShadowVerdicts"
            EXTRA=--no-write
          fi
          # Sweep one PR at a time, each against ITS OWN checked-out tree, so the
          # planning/decision-log mirror scripts read that PR's docs/efforts/.
          # origin is the swept repo (checkout used repository: matrix.repo).
          read -ra pr_args <<< "$PRS"
          for pr in "${pr_args[@]}"; do
            if ! git fetch --depth 1 origin "refs/pull/${pr}/head" 2>/dev/null; then
              echo "::warning::cannot fetch ${SHADOW_REPO}#${pr} head - skipping"; continue
            fi
            git checkout -q --detach FETCH_HEAD
            python3 /tmp/stack/shadow/shadow-sweep.py ${EXTRA:-} \
              --repo "$SHADOW_REPO" --repo-dir . --stack-dir /tmp/stack "$pr"
          done
      - name: Nothing to sweep
        if: steps.window.outputs.prs == ''
        run: echo "No PRs in the window for ${{ matrix.repo }} - nothing to sweep."

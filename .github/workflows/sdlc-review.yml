# The review gate: no merge without a review record (SDLC loop: the "review" stage).
# Vendor into a repo as .github/workflows/sdlc-review.yml.
#
# COST-TIERED. The gate requires a review record to exist; how it is produced
# is tiered so the expensive cloud path only fires when a local subscription
# review did not run:
#   1. If .review/review.json exists (produced locally on subscription by the
#      interrogate skill), validate it. Done. Nothing cloud fires.
#   2. If it is absent (a cloud/background agent did the work, no laptop/
#      subscription), the cloud fallback runs the panel and writes the record,
#      then validates. The fallback is the expensive path - conditional, rare.
#
# The validated record feeds the combined effort report (proof + review).
name: sdlc-review
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install the TensorLake CLI (to reach the computer)
        run: |
          curl -fsSL https://tensorlake.ai/install | sh >/dev/null 2>&1 || true
          echo "$HOME/.tensorlake/bin" >> "$GITHUB_PATH"
      - name: Fetch the review toolkit from stack
        env:
          STACK_TOKEN: ${{ secrets.STACK_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${STACK_TOKEN}@github.com/arni-labs/stack /tmp/stack || {
            echo "::error::cannot reach arni-labs/stack for the review toolkit"; exit 1; }
      - name: Tier 1 - a valid local review record posted to the PR?
        id: tier1
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # The local panel (interrogate) posts its record as a PR comment carrying
          # a hidden marker: <!-- sdlc-review-record\n{json}\n-->. Nothing is committed.
          # We extract it, and trust it only if it is for THIS head and non-author.
          python3 - <<'PY'
          import json, os, re, subprocess
          n="${{ github.event.pull_request.number }}"
          body=subprocess.run(["gh","pr","view",n,"--json","comments","-q",
                               ".comments[].body"],capture_output=True,text=True).stdout
          rec=None
          for m in re.finditer(r"<!--\s*sdlc-review-record\s*(\{.*?\})\s*-->", body, re.S):
              try: rec=json.loads(m.group(1))
              except Exception: pass
          ok=False
          if rec:
              open(".review-local.json","w").write(json.dumps(rec))
              ok = subprocess.run(["python3","/tmp/stack/review/validate.py",".review-local.json",
                                   "--require-commit",os.environ["PR_HEAD"],
                                   "--author",os.environ["PR_AUTHOR"]]).returncode==0
          open(os.environ["GITHUB_OUTPUT"],"a").write(f"present={'true' if ok else 'false'}\n")
          print("valid local record on PR; skipping cloud panel" if ok else "no valid local record; cloud panel will run")
          PY
      - name: Tier 2 - cloud fallback panel (only if no local record)
        if: steps.tier1.outputs.present == 'false'
        env:
          # The cloud panel prefers the sandbox running interrogate on subscription
          # CLIs (Rita confirmed the sandbox can run them). If the sandbox is not
          # configured, it falls to paid vendor actions/APIs. Greptile/Bugbot run
          # as GitHub Apps independently and their findings merge in.
          REVIEW_SANDBOX_ID: ${{ secrets.REVIEW_SANDBOX_ID }}
          TL_API_KEY: ${{ secrets.TL_API_KEY }}
          TENSORLAKE_API_KEY: ${{ secrets.TL_API_KEY }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_REPO: ${{ github.event.repository.name }}
          PR_URL: ${{ github.event.repository.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          mkdir -p .review
          python3 /tmp/stack/review/run-cloud-panel.py \
            --base "$PR_BASE" --head "$PR_HEAD" --repo "$PR_REPO" --repo-url "$PR_URL" \
            --effort "$PR_TITLE" --intent "$PR_BODY" --out .review/review.json
      - name: Merge Greptile (GitHub App) or record it skipped
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          p=".review/review.json"
          if not os.path.isfile(p):
              raise SystemExit(0)
          r=json.load(open(p))
          # did greptile leave a review on this PR?
          pr=os.environ.get("GITHUB_REF_NAME","")
          out=subprocess.run(["gh","pr","view","${{ github.event.pull_request.number }}",
                              "--json","reviews","-q",".reviews[].author.login"],
                             capture_output=True,text=True).stdout.lower()
          if "greptile" in out:
              r.setdefault("reviewers_ran",[])
              if "greptile" not in r["reviewers_ran"]: r["reviewers_ran"].append("greptile")
          else:
              r.setdefault("reviewers_skipped",[]).append(
                  {"reviewer":"greptile","reason":"Greptile GitHub App has not reviewed this PR (install it, or it is still running)"})
          json.dump(r,open(p,"w"),indent=2)
          print("greptile:", "ran" if "greptile" in out else "skipped-with-reason")
          PY

      - name: Validate the review record (the gate)
        run: |
          # panel is read from stack/review/panel.json (single source of truth)
          python3 /tmp/stack/review/validate.py .review/review.json
      - name: Fold into the effort report + comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('.review/review.json')) return;
            const r = JSON.parse(fs.readFileSync('.review/review.json','utf8'));
            const openActons = (r.findings||[]).filter(f => f.severity==='act-on' && !f.resolved).length;
            const verdict = openActons ? 'FAIL' : 'PASS';
            const body = "<!-- sdlc-review -->\n" +
              `### Review — ${r.effort}: **${verdict}**\n` +
              `Panel: ${(r.reviewers_ran||[]).join(', ')}` +
              (r.reviewers_skipped?.length ? ` (skipped: ${r.reviewers_skipped.map(s=>s.reviewer).join(', ')})` : '') +
              `\nOpen act-on findings: **${openActons}** · synthesis by: ${r.synthesis_by} · tier: ${r.produced_by?.tier}\n` +
              `\nFull effort report (proof + review) linked from the verification comment.`;
            const {data: comments} = await github.rest.issues.listComments({...context.repo, issue_number: context.issue.number});
            const mine = comments.find(c => c.body.includes('<!-- sdlc-review -->'));
            if (mine) await github.rest.issues.updateComment({...context.repo, comment_id: mine.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});

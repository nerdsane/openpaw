# The review gate: no merge without a review record (SDLC loop: the "review" stage).
# Vendor into a repo as .github/workflows/sdlc-review.yml.
#
# COST-TIERED. The gate requires a review record to exist; how it is produced
# is tiered so the expensive cloud path only fires when a local subscription
# review did not run:
#   1. If .review/review.json exists (produced locally on subscription by the
#      interrogate skill), validate it. Done. Nothing cloud fires.
#   2. If it is absent (a cloud/background agent did the work, no laptop/
#      subscription), the cloud fallback runs the panel and writes the record,
#      then validates. The fallback is the expensive path - conditional, rare.
#
# The validated record feeds the combined effort report (proof + review).
name: sdlc-review
on:
  pull_request:
    # `edited` included: reviewers receive the PR body as intent, so a body
    # edit (e.g. new standing decisions) must re-run the panel against it
    types: [opened, synchronize, reopened, labeled, edited]
concurrency:
  group: sdlc-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: write        # the routing step enables auto-merge
  pull-requests: write
  checks: write
jobs:
  review:
    runs-on: ubuntu-latest
    env:
      HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install the TensorLake CLI (to reach the computer)
        run: |
          # the runner is ephemeral and the panel tools call the binary by its
          # absolute path (~/.tensorlake/bin/tl) - nothing is prepended to PATH,
          # so the installer's directory never shadows later commands
          curl -fsSL https://tensorlake.ai/install | sh >/dev/null 2>&1 || true
          "$HOME/.tensorlake/bin/tl" version 2>/dev/null || echo "tl unavailable - cloud tier will fall through"
      - name: Convergence breaker (rabbit-hole detection)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUM: ${{ github.event.pull_request.number }}
          STACK_TOKEN: ${{ secrets.STACK_TOKEN }}
          TENSORLAKE_API_KEY: ${{ secrets.TL_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # A panel->fix->re-review loop that passes 3 rounds on one PR is a
          # rabbit-hole signal: over-complexity or a contested design. The fix at
          # that point is deletion or an owner decision, not another round - so
          # the gate STOPS and says so, instead of burning a fourth panel. The
          # owner re-arms it by adding the 'converge-ack' label after deciding.
          if gh pr view "$PR_NUM" --json labels -q '.labels[].name' | grep -qx converge-ack; then
            # consume the ack: it authorizes exactly ONE resumed round, so the
            # breaker re-arms for any future stall instead of dying forever
            gh pr edit "$PR_NUM" --remove-label converge-ack 2>/dev/null || true
            echo "converge-ack present - owner has decided; ack consumed, continuing"; exit 0; fi
          # count only rounds that failed at the VALIDATE step (real findings);
          # an infra failure (box unreachable, clone error) is not a review round
          ROUNDS=0
          for RID in $(gh run list --workflow sdlc-review --branch "$PR_BRANCH" --status completed --limit 15 --json databaseId,conclusion -q '.[] | select(.conclusion == "failure") | .databaseId'); do
            FAILED_VALIDATE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RID}/jobs" -q '[.jobs[].steps[] | select(.name | startswith("Validate the review record")) | select(.conclusion == "failure")] | length' 2>/dev/null || echo 0)
            [ "${FAILED_VALIDATE:-0}" != "0" ] && ROUNDS=$((ROUNDS+1))
          done
          if [ "${ROUNDS:-0}" -ge 3 ]; then
            gh pr edit "$PR_NUM" --add-label human-review 2>/dev/null || true
            # neither arguing party can diagnose the stall (the implementer
            # defends, the panel generates the findings): a FRESH arbiter reads
            # the whole history and writes a decision brief for the human -
            # threads classified, options, one recommendation. The human decides
            # from the brief, records the ruling as standing decisions, and
            # re-arms with converge-ack. Falls back to a mechanical findings
            # grouping if no model is reachable - the human always gets structure.
            git clone --depth 1 https://x-access-token:${STACK_TOKEN}@github.com/arni-labs/stack /tmp/stack-arb 2>/dev/null || true
            gh pr view "$PR_NUM" --json body -q .body > /tmp/pr-intent.txt || true
            python3 /tmp/stack-arb/review/run-arbiter.py --pr "$PR_NUM" --branch "$PR_BRANCH"               --intent-file /tmp/pr-intent.txt --out /tmp/brief.md 2>/dev/null || true
            {
              echo "**Convergence stalled** - $ROUNDS failed review rounds. The loop stops here: the fix is an owner decision, not another round."
              echo
              cat /tmp/brief.md 2>/dev/null || echo "(arbiter unavailable - see the round logs)"
              echo
              echo "---"
              echo "**To respond**: comment on this PR starting with \`DECISION:\` followed by your ruling, whenever you get to it. The pipeline picks it up from there - it records the ruling in the standing decisions and re-arms the review gate. No agent required."
            } > /tmp/breaker-comment.md
            gh pr comment "$PR_NUM" --body-file /tmp/breaker-comment.md 2>/dev/null || true
            # tell the human where they are needed - short, actionable, in Slack
            if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
              VERDICT=$(head -c 400 /tmp/brief.md 2>/dev/null | grep -A2 -i "verdict" | tail -2 | tr '\n' ' ' | head -c 280)
              PR_URL="https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUM}"
              python3 - "$PR_URL" "$ROUNDS" "$VERDICT" <<'PYEOF' || true
          import json, sys, os, urllib.request
          url, rounds, verdict = sys.argv[1], sys.argv[2], sys.argv[3]
          msg = (f":vertical_traffic_light: *Review loop stalled* after {rounds} rounds on {url}\n"
                 f"Arbiter's take: {verdict or 'see the brief on the PR'}\n"
                 f"*What to do*: read the decision brief (top comment on the PR), then reply there "
                 f"with a comment starting `DECISION: <your ruling>`. The pipeline handles the rest.")
          req = urllib.request.Request(os.environ["SLACK_WEBHOOK_URL"],
                                       data=json.dumps({"text": msg}).encode(),
                                       headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=10)
          print("slack notified")
          PYEOF
            else
              echo "SLACK_WEBHOOK_URL not set - no Slack notification (the brief is on the PR)"
            fi
            echo "::error::convergence stalled after $ROUNDS rounds - decision brief posted; owner responds with a DECISION: comment on the PR"
            exit 1
          fi
          echo "review rounds so far: ${ROUNDS:-0}"
      - name: Fetch the review toolkit from stack
        env:
          STACK_TOKEN: ${{ secrets.STACK_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${STACK_TOKEN}@github.com/arni-labs/stack /tmp/stack || {
            echo "::error::cannot reach arni-labs/stack for the review toolkit"; exit 1; }
      - name: Derive the authoring harness
        id: author
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # synthesis_by names a HARNESS (claude/codex/grok/cursor), not a GitHub
          # login - all work flows through one GitHub account, so comparing against
          # the login is vacuous. The branch naming convention (<agent>/<task>)
          # carries the authoring harness; unknown prefixes stay "unknown" and the
          # non-author check then only rejects a literal "unknown" synthesis.
          case "${PR_BRANCH%%/*}" in
            claude|codex|grok|cursor) echo "harness=${PR_BRANCH%%/*}" >> "$GITHUB_OUTPUT" ;;
            *) echo "harness=unknown" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Tier 1 - a valid local review record posted to the PR?
        id: tier1
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ steps.author.outputs.harness }}
          PR_NUM: ${{ github.event.pull_request.number }}
          GH_REPO_FULL: ${{ github.repository }}
          PR_GH_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # The local panel (interrogate) posts its record as a PR comment carrying
          # a hidden marker: <!-- sdlc-review-record\n{json}\n-->. Nothing is committed.
          # We extract it, and trust it only if the COMMENT came from a repo
          # owner/member/collaborator (a drive-by commenter cannot supply a review)
          # and the record validates for THIS head with a non-author synthesis.
          python3 - <<'PY'
          import json, os, re, subprocess
          n=os.environ["PR_NUM"]; repo=os.environ["GH_REPO_FULL"]
          out=subprocess.run(["gh","api",f"repos/{repo}/issues/{n}/comments","--paginate",
                              "-q",'.[] | {assoc: .author_association, login: .user.login, body: .body}'],
                             capture_output=True,text=True).stdout
          rec=None
          for line in out.splitlines():
              try: c=json.loads(line)
              except Exception: continue
              if c.get("assoc") not in ("OWNER","MEMBER","COLLABORATOR"):
                  continue   # untrusted commenter - their marker does not count
              if c.get("login","").lower() == os.environ.get("PR_GH_AUTHOR","").lower():
                  continue   # collaborator status proves repo access, not that the
                             # panel ran: the record must come from a NON-AUTHOR account
              for m in re.finditer(r"<!--\s*sdlc-review-record\s*(\{.*?\})\s*-->", c.get("body",""), re.S):
                  try: rec=json.loads(m.group(1))
                  except Exception: pass
          ok=False
          if rec:
              os.makedirs(".review",exist_ok=True)
              open(".review-local.json","w").write(json.dumps(rec))
              ok = subprocess.run(["python3","/tmp/stack/review/validate.py",".review-local.json",
                                   "--require-commit",os.environ["PR_HEAD"],
                                   "--author",os.environ["PR_AUTHOR"]]).returncode==0
              if ok:
                  # the gate and the report read .review/review.json on BOTH tiers
                  open(".review/review.json","w").write(json.dumps(rec))
          open(os.environ["GITHUB_OUTPUT"],"a").write(f"present={'true' if ok else 'false'}\n")
          print("valid local record on PR; skipping cloud panel" if ok else "no valid local record; cloud panel will run")
          PY
      - name: Tier 2 - cloud fallback panel (only if no local record)
        if: steps.tier1.outputs.present == 'false'
        env:
          # The cloud panel prefers the sandbox running interrogate on subscription
          # CLIs (Rita confirmed the sandbox can run them). If the sandbox is not
          # configured, it falls to paid vendor actions/APIs. Greptile/Bugbot run
          # as GitHub Apps independently and their findings merge in.
          REVIEW_SANDBOX_ID: ${{ secrets.REVIEW_SANDBOX_ID }}
          TL_API_KEY: ${{ secrets.TL_API_KEY }}
          TENSORLAKE_API_KEY: ${{ secrets.TL_API_KEY }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_REPO: ${{ github.event.repository.name }}
          PR_URL: ${{ github.event.repository.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          mkdir -p .review
          python3 /tmp/stack/review/run-cloud-panel.py \
            --base "$PR_BASE" --head "$PR_HEAD" --repo "$PR_REPO" --repo-url "$PR_URL" \
            --effort "$PR_TITLE" --intent "$PR_BODY" --out .review/review.json
      - name: Merge Greptile (GitHub App) or record it skipped
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          p=".review/review.json"
          if not os.path.isfile(p):
              raise SystemExit(0)
          r=json.load(open(p)); n=os.environ["PR_NUM"]; head=os.environ["PR_HEAD"]
          # did greptile review THIS head? A review of an older commit is stale -
          # the code it judged is not the code being merged.
          out=subprocess.run(["gh","api",
                              f"repos/{os.environ.get('GITHUB_REPOSITORY','')}/pulls/{n}/reviews",
                              "--paginate","-q",
                              '.[] | select(.user.login|test("greptile";"i")) | .commit_id'],
                             capture_output=True,text=True).stdout
          if head in out:
              r.setdefault("reviewers_ran",[])
              if "greptile" not in r["reviewers_ran"]: r["reviewers_ran"].append("greptile")
              # copy greptile's inline findings INTO the record so the report and
              # the synthesis see them - detection without the findings is useless
              rc=subprocess.run(["gh","api",
                                 f"repos/{os.environ.get('GITHUB_REPOSITORY','')}/pulls/{n}/comments",
                                 "--paginate","-q",
                                 '.[] | select(.user.login|test("greptile";"i")) | {path,line,body,commit_id}'],
                                capture_output=True,text=True).stdout
              # schema fields: by / file_line / claim / severity / resolved.
              # Greptile enters as "consider" (in-schema, advisory): the app is an
              # extra pair of eyes, and the panel's synthesis judges its findings -
              # only panel act-ons block. Out-of-schema fields would make the
              # record fail schema validation and vanish from the report.
              existing={ (f.get("file_line"),f.get("by")) for f in r.get("findings",[]) }
              added=0
              # review BODIES too - Greptile often writes findings in the summary
              rb=subprocess.run(["gh","api",
                                 f"repos/{os.environ.get('GITHUB_REPOSITORY','')}/pulls/{n}/reviews",
                                 "--paginate","-q",
                                 '.[] | select(.user.login|test("greptile";"i")) | select(.commit_id=="'+head+'") | .body'],
                                capture_output=True,text=True).stdout.strip()
              if rb and ("summary-body","greptile") not in existing:
                  r.setdefault("findings",[]).append({
                      "by":"greptile","file_line":"summary-body","severity":"consider",
                      "resolved":False,"claim":rb[:4000]})
                  added+=1
              for line in rc.splitlines():
                  try: c=json.loads(line)
                  except Exception: continue
                  if c.get("commit_id") != head:
                      continue   # stale inline comment from an older head
                  file_line=f"{c.get('path','?')}:{c.get('line') or '?'}"
                  if (file_line,"greptile") in existing: continue
                  r.setdefault("findings",[]).append({
                      "by":"greptile","file_line":file_line,"severity":"consider",
                      "resolved":False,"claim":(c.get("body") or "")[:2000]})
                  added+=1
              print(f"greptile: ran, {added} inline findings merged")
          else:
              r.setdefault("reviewers_skipped",[]).append(
                  {"reviewer":"greptile","reason":"Greptile GitHub App has not reviewed this PR (install it, or it is still running)"})
              print("greptile: skipped-with-reason")
          json.dump(r,open(p,"w"),indent=2)
          PY

      - name: Apply owner adjudications (RESOLVE comments)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_REPO_FULL: ${{ github.repository }}
          PR_GH_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # The owner's equivalent of dismissing a review: a trusted NON-AUTHOR
          # comment line `RESOLVE: <file:line> <reason>` marks the matching
          # finding resolved, the adjudication recorded as its resolution.
          # Auditable (the comment stays), scoped (one finding per line) - how a
          # judged re-litigation stops holding the gate red after the ruling.
          [ -f .review/review.json ] || exit 0
          python3 - <<'PY'
          import json, os, re, subprocess
          n=os.environ["PR_NUM"]; repo=os.environ["GH_REPO_FULL"]
          author=os.environ.get("PR_GH_AUTHOR","").lower()
          out=subprocess.run(["gh","api",f"repos/{repo}/issues/{n}/comments","--paginate",
                              "-q",'.[] | {assoc: .author_association, login: .user.login, body: .body}'],
                             capture_output=True,text=True).stdout
          head=os.environ.get("PR_HEAD","")
          resolutions={}
          for line in out.splitlines():
              try: c=json.loads(line)
              except Exception: continue
              login=c.get("login","").lower()
              # bots are NEVER trusted for adjudication: bot comments echo
              # attacker-controlled PR metadata (e.g. the title) verbatim
              if c.get("assoc") not in ("OWNER","MEMBER","COLLABORATOR"): continue
              if login == author or login.endswith("[bot]"): continue
              # format: RESOLVE: <head7> <file:line> <reason> - the head prefix
              # pins the ruling to THIS code, so an old ruling cannot resolve a
              # new finding that later appears at the same file:line
              for m in re.finditer(r"^RESOLVE:\s*([0-9a-f]{7,40})\s+(\S+)\s+(.+)$", c.get("body",""), re.M):
                  if head.startswith(m.group(1)):
                      resolutions[m.group(2)] = m.group(3).strip()
          if resolutions:
              r=json.load(open(".review/review.json")); hit=0
              for f in r.get("findings",[]):
                  fl=f.get("file_line","")
                  if fl in resolutions and not f.get("resolved"):
                      f["resolved"]=True
                      f["resolution"]=f"owner adjudication: {resolutions[fl]}"
                      hit+=1
              json.dump(r,open(".review/review.json","w"),indent=2)
              print(f"owner adjudications applied: {hit}")
          else:
              print("no adjudication comments")
          PY
      - name: Validate the review record (the gate)
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # panel is read from stack/review/panel.json (single source of truth).
          # BOTH tiers are held to the same bar here: the record must be for this
          # head and synthesized by a non-author harness - tier 2 gets no free pass.
          python3 /tmp/stack/review/validate.py .review/review.json \
            --require-commit "$PR_HEAD" --author "${{ steps.author.outputs.harness }}"
      - name: Rebuild the combined effort report (proof + review)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_GH_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # the verification gate renders the proof half before any review exists;
          # once the review record is here, the combined report is rebuilt so the
          # effort report always ends up carrying BOTH halves
          [ -f .review/review.json ] || exit 0
          python3 - <<'PY'
          import json, os, re, subprocess
          n=os.environ["PR_NUM"]; repo=os.environ.get("GITHUB_REPOSITORY","")
          head=os.environ.get("PR_HEAD",""); pr_author=os.environ.get("PR_GH_AUTHOR","").lower()
          out=subprocess.run(["gh","api",f"repos/{repo}/issues/{n}/comments","--paginate",
                              "-q",'.[] | {assoc: .author_association, login: .user.login, body: .body}'],
                             capture_output=True,text=True).stdout
          rec=None
          for line in out.splitlines():
              try: c=json.loads(line)
              except Exception: continue
              if c.get("assoc") not in ("OWNER","MEMBER","COLLABORATOR"): continue
              if c.get("login","").lower()==pr_author: continue
              for m in re.finditer(r"<!--\s*sdlc-proof-record\s*(\{.*?\})\s*-->", c.get("body",""), re.S):
                  try: cand=json.loads(m.group(1))
                  except Exception: continue
                  if cand.get("commit")==head: rec=cand   # same bar as the proof gate
          if rec:
              os.makedirs(".proof",exist_ok=True)
              json.dump(rec, open(".proof/proof.json","w"))
              print("proof record found - rendering combined report")
          else:
              print("no trusted proof record for this head - review-only report")
          PY
          if [ -f .proof/proof.json ]; then
            if ! python3 /tmp/stack/proof/render.py .proof/proof.json --review .review/review.json \
                 --out .review/effort-report.html > /dev/null; then
              echo "::warning::combined report renderer failed - no effort-report artifact this run"
              rm -f .review/effort-report.html
            fi
          fi
      - name: Deploy the combined report (replaces the proof-only page)
        id: combined
        if: ${{ always() && env.HAS_VERCEL == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          [ -f .review/effort-report.html ] || exit 0
          npm i -g vercel@latest >/dev/null 2>&1
          mkdir -p /tmp/report && cp .review/effort-report.html /tmp/report/index.html
          URL=$(vercel deploy /tmp/report --yes --token "$VERCEL_TOKEN" 2>/dev/null | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: effort-report
          path: |
            .review/review.json
            .review/effort-report.html
          if-no-files-found: ignore
      - name: Route on the panel's risk judgment
        # Runs only when the gate above PASSED. The design, whole: the reviewers
        # judged risk in the record (the panel already keeps the most conservative
        # across reviewers); low means auto-merge, anything else means a human
        # presses merge. No other logic. One guard: a PR that changes workflow
        # files routes to a human, because its own checks cannot be trusted to be
        # the base gates.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          RISK=$(python3 -c "import json; r=json.load(open('.review/review.json')); print(r.get('risk','high'))")
          # an earlier low-risk run may have armed auto-merge; any non-low outcome
          # on the current head must revoke it, or GitHub merges a head this
          # review assigned to a human
          if git diff --name-only "origin/${PR_BASE_REF}...HEAD" | grep -q '^\.github/workflows/'; then
            gh pr merge "$PR_NUM" --disable-auto 2>/dev/null || true
            gh pr edit "$PR_NUM" --add-label human-review 2>/dev/null || true
            echo "workflow files changed - auto-merge revoked, a human presses merge"; exit 0; fi
          if [ "$RISK" = "low" ]; then
            gh pr merge "$PR_NUM" --squash --auto && echo "auto-merge enabled: panel risk low, gates green"
          else
            gh pr merge "$PR_NUM" --disable-auto 2>/dev/null || true
            gh pr edit "$PR_NUM" --add-label human-review 2>/dev/null || true
            echo "panel risk $RISK - auto-merge revoked, a human presses merge"
          fi
      - name: Fold into the effort report + comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('.review/review.json')) return;
            const r = JSON.parse(fs.readFileSync('.review/review.json','utf8'));
            const openActons = (r.findings||[]).filter(f => f.severity==='act-on' && !f.resolved).length;
            const verdict = openActons ? 'FAIL' : 'PASS';
            const body = "<!-- sdlc-review -->\n" +
              `### Review — ${r.effort}: **${verdict}**\n` +
              `Panel: ${(r.reviewers_ran||[]).join(', ')}` +
              (r.reviewers_skipped?.length ? ` (skipped: ${r.reviewers_skipped.map(s=>s.reviewer).join(', ')})` : '') +
              `\nOpen act-on findings: **${openActons}** · synthesis by: ${r.synthesis_by} · tier: ${r.produced_by?.tier}\n` +
              ('${{ steps.combined.outputs.url }}'
                ? `\n**[Open the combined effort report (team-only)](${{ steps.combined.outputs.url }})**\n`
                : `\nCombined effort report: the \`effort-report\` artifact on this run.\n`) +
              // the machine record rides in the comment so the auto-merge router can
              // validate it (commit + author) and read the panel's risk - the cloud
              // tier otherwise never leaves a record marker on the PR
              `<!-- sdlc-review-record\n${JSON.stringify(r)}\n-->`;
            const {data: comments} = await github.rest.issues.listComments({...context.repo, issue_number: context.issue.number});
            const mine = comments.find(c => c.body.includes('<!-- sdlc-review -->'));
            if (mine) await github.rest.issues.updateComment({...context.repo, comment_id: mine.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});

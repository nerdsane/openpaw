name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: cd dashboard && npm install
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy -p temperpaw --all-targets -- -D warnings
      - name: Cargo check
        run: cargo check -p temperpaw
      - name: WASM build (os-apps)
        run: |
          set -e
          for script in \
            os-apps/paw-agent/wasm/build.sh \
            os-apps/paw-channels/wasm/build.sh \
            os-apps/paw-fs/wasm/blob_adapter/build.sh \
            os-apps/paw-fs/wasm/workspace_fs/build.sh \
            os-apps/paw-managed-agents/wasm/build.sh \
            os-apps/paw-research/wasm/build.sh; do
            echo "=== Running $script ==="
            (cd "$(dirname "$script")" && bash "$(basename "$script")")
          done
      - name: Cargo test
        run: cargo test -p temperpaw --quiet
      - name: Dashboard build
        run: cd dashboard && npm run build

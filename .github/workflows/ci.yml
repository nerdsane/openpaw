name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: cd dashboard && npm install
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --locked -p temperpaw -p paw-codex-worker --all-targets -- -D warnings
      - name: Cargo check
        run: cargo check --locked -p temperpaw -p paw-codex-worker
      - name: Worker smoke script syntax
        run: |
          bash -n crates/paw-codex-worker/scripts/deterministic-smoke.sh
          bash -n crates/paw-codex-worker/scripts/repo-sweep-brief-smoke.sh
          bash -n crates/paw-codex-worker/scripts/webhook-intake-smoke.sh
          bash -n crates/paw-codex-worker/scripts/production-readiness.sh
          bash -n crates/paw-codex-worker/scripts/production-readiness-smoke.sh
          bash -n crates/paw-codex-worker/scripts/paw-patrol-acceptance.sh
      - name: WASM build (os-apps)
        run: |
          set -e
          for script in \
            os-apps/paw-agent/wasm/build.sh \
            os-apps/paw-channels/wasm/build.sh \
            os-apps/paw-fs/wasm/blob_adapter/build.sh \
            os-apps/paw-fs/wasm/workspace_fs/build.sh \
            os-apps/paw-ingest/wasm/build.sh \
            os-apps/paw-managed-agents/wasm/build.sh \
            os-apps/paw-skills/wasm/build.sh \
            os-apps/paw-research/wasm/build.sh \
            os-apps/paw-patrol/wasm/build.sh; do
            echo "=== Running $script ==="
            (cd "$(dirname "$script")" && bash "$(basename "$script")")
          done
      - name: Cargo test
        run: |
          cargo test --locked -p temperpaw --quiet
          cargo test --locked -p paw-codex-worker --quiet
          cargo test --manifest-path os-apps/paw-patrol/wasm/review_gate_lifecycle/Cargo.toml --quiet
      - name: Dashboard build
        run: cd dashboard && npm run build

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: cd dashboard && npm install
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --locked -p temperpaw -p paw-codex-worker --all-targets -- -D warnings
      - name: Cargo check
        run: cargo check --locked -p temperpaw -p paw-codex-worker
      - name: Worker smoke script syntax
        run: |
          bash -n crates/paw-codex-worker/scripts/deterministic-smoke.sh
          bash -n crates/paw-codex-worker/scripts/datadog-patrol-smoke.sh
          bash -n crates/paw-codex-worker/scripts/repo-sweep-brief-smoke.sh
          bash -n crates/paw-codex-worker/scripts/webhook-intake-smoke.sh
          bash -n crates/paw-codex-worker/scripts/production-readiness.sh
          bash -n crates/paw-codex-worker/scripts/production-preflight.sh
          bash -n crates/paw-codex-worker/scripts/directed-evolution-agent-answers-live-proof.sh
          bash -n crates/paw-codex-worker/scripts/production-git-ancestry-guard.sh
          bash -n crates/paw-codex-worker/scripts/production-observe-only.sh
          bash -n crates/paw-codex-worker/scripts/production-preflight-github-smoke.sh
          bash -n crates/paw-codex-worker/scripts/production-git-ancestry-guard-smoke.sh
          bash -n crates/paw-codex-worker/scripts/production-observe-only-smoke.sh
          bash -n crates/paw-codex-worker/scripts/production-readiness-smoke.sh
          bash -n crates/paw-codex-worker/scripts/mac-mini-production-bootstrap.sh
          bash -n crates/paw-codex-worker/scripts/ci-actions-runtime-smoke.sh
          bash -n crates/paw-codex-worker/scripts/paw-patrol-acceptance.sh
          crates/paw-codex-worker/scripts/ci-actions-runtime-smoke.sh
          crates/paw-codex-worker/scripts/production-git-ancestry-guard-smoke.sh
      - name: Agent Answers proof precheck
        run: |
          set -euo pipefail
          PROOF_DIR="${RUNNER_TEMP}/agent-answers-live-proof-precheck"
          rm -rf "$PROOF_DIR"
          PRECHECK_ONLY=1 \
          PROOF_DIR="$PROOF_DIR" \
          ALLOW_PRODUCTION_WRITE=1 \
          CONFIRM_AGENT_ANSWERS_LIVE_PROOF=1 \
          CONFIRM_PRODUCTION_DATADOG_QUERY_SECRETS=1 \
          TEMPER_URL=https://temperpaw-ci.example.invalid \
          WORKER_TOKEN=ci-proof-token \
          DIRECTED_EVOLUTION_ORGANISM_ID=agent-answers-ci-organism \
          DIRECTED_EVOLUTION_DIRECTION_ID=agent-answers-ci-direction \
          START_LOCAL_WORKER=0 \
          crates/paw-codex-worker/scripts/directed-evolution-agent-answers-live-proof.sh
          jq -e '.status == "ready" and .no_mutation == true and .would_create_live_episode == true' "$PROOF_DIR/summary.json"
          grep -F '"no_mutation": true' "$PROOF_DIR/summary.json"
          test ! -e "$PROOF_DIR/episode-start.json"
          test ! -e "$PROOF_DIR/agent-answers-episode-contract.json"
      - name: WASM build (os-apps)
        run: |
          set -e
          for script in \
            os-apps/paw-agent/wasm/build.sh \
            os-apps/paw-channels/wasm/build.sh \
            os-apps/paw-fs/wasm/blob_adapter/build.sh \
            os-apps/paw-fs/wasm/workspace_fs/build.sh \
            os-apps/paw-ingest/wasm/build.sh \
            os-apps/paw-managed-agents/wasm/build.sh \
            os-apps/paw-skills/wasm/build.sh \
            os-apps/paw-research/wasm/build.sh \
            os-apps/paw-patrol/wasm/build.sh; do
            echo "=== Running $script ==="
            (cd "$(dirname "$script")" && bash "$(basename "$script")")
          done
      - name: Cargo test
        run: |
          cargo test --locked -p temperpaw --quiet
          cargo test --locked -p paw-codex-worker --quiet
          cargo test --manifest-path os-apps/paw-patrol/wasm/review_gate_lifecycle/Cargo.toml --quiet
      - name: Dashboard build
        run: cd dashboard && npm run build

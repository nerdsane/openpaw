[workspace]
resolver = "2"
members = [
    "crates/openpaw",
    "crates/paw-transport",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.28"
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio", "logs", "metrics"] }
opentelemetry-otlp = { version = "0.28", features = ["grpc-tonic", "logs", "metrics"] }
opentelemetry-appender-tracing = "0.28"
tracing-opentelemetry = "0.29"
axum = { version = "0.8", features = ["macros"] }
anyhow = "1"

[patch."https://github.com/nerdsane/temper.git"]
temper-authz = { path = "../temper/crates/temper-authz" }
temper-jit = { path = "../temper/crates/temper-jit" }
temper-macros = { path = "../temper/crates/temper-macros" }
temper-odata = { path = "../temper/crates/temper-odata" }
temper-observe = { path = "../temper/crates/temper-observe" }
temper-platform = { path = "../temper/crates/temper-platform" }
temper-runtime = { path = "../temper/crates/temper-runtime" }
temper-sandbox = { path = "../temper/crates/temper-sandbox" }
temper-server = { path = "../temper/crates/temper-server" }
temper-spec = { path = "../temper/crates/temper-spec" }
temper-store-postgres = { path = "../temper/crates/temper-store-postgres" }
temper-store-redis = { path = "../temper/crates/temper-store-redis" }
temper-store-turso = { path = "../temper/crates/temper-store-turso" }
temper-wasm = { path = "../temper/crates/temper-wasm" }

extensions:
  health_check:
    endpoint: "0.0.0.0:13133"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  # Detect host / container attributes so spans, metrics, and logs carry
  # host.name, container.id, etc. Datadog APM requires host.name to
  # correctly bucket spans; without this the otel-collector's datadog
  # exporter falls back to the process hostname which in Railway containers
  # is an opaque 12-hex ID and can cause indexing issues. See ADR-0037.
  resourcedetection:
    detectors: [env, system, docker]
    timeout: 5s
    override: false
  # Guarantee service.name even if a signal arrives without resource
  # attributes (defence in depth — temper-observe already sets this,
  # but a guest module emitting OTLP directly would not).
  resource:
    attributes:
      - key: service.name
        value: openpaw
        action: upsert
  filter/traces_llmobs:
    error_mode: ignore
    traces:
      span:
        - 'attributes["gen_ai.system"] == nil'
  filter/traces_apm:
    error_mode: ignore
    traces:
      span:
        - 'attributes["gen_ai.system"] != nil'
  batch:
    send_batch_size: 1000
    timeout: 5s

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=lz4
    database: default
    username: default
    password: ""
    traces_table_name: otel_traces
    metrics_table_name: otel_metrics
    logs_table_name: otel_logs
    ttl: 72h
    create_schema: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
  datadog:
    api:
      key: ${env:DD_API_KEY}
      site: ${env:DD_SITE}
  otlphttp/llmobs:
    endpoint: https://otlp-intake.${env:DD_SITE}
    headers:
      dd-api-key: ${env:DD_API_KEY}
      dd-otlp-source: llmobs

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces/llmobs:
      receivers: [otlp]
      processors: [resourcedetection, resource, filter/traces_llmobs, batch]
      exporters: [clickhouse, otlphttp/llmobs]
    traces/apm:
      receivers: [otlp]
      processors: [resourcedetection, resource, filter/traces_apm, batch]
      exporters: [clickhouse, datadog]
    metrics:
      receivers: [otlp]
      processors: [resourcedetection, resource, batch]
      exporters: [clickhouse, datadog]
    logs:
      receivers: [otlp]
      processors: [resourcedetection, resource, batch]
      exporters: [clickhouse, datadog]

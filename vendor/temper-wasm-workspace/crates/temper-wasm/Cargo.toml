[package]
name = "temper-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
description = "WASM sandboxed integration runtime for Temper"

[dependencies]
wasmtime = { version = "29", features = ["component-model"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10"
async-trait = "0.1"

[features]
test-helpers = []

[dev-dependencies]
tokio-test = "0.4"

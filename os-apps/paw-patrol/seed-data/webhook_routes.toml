# Patrol-owned intake routes through paw-ingest.
# The HTTP trigger still creates only WebhookEvent and dispatches Received.
# These route configs make the WASM routing leg create Patrol entities next.

[[instance]]
id = "patrol-request-route"
type = "WebhookRoute"

[instance.fields]
route_key = "patrol-request"
source_type = "patrol-request"
event_filter = "*"
target_entity_type = "PatrolRequest"
target_action = "TemperPaw.Patrol.Submit"
webhook_secret = ""
monitor_resolution_enabled = "false"
dedup_enabled = "false"
dedup_window_minutes = "60"


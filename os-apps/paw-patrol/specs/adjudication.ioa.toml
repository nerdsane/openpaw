# Adjudication (ARN-430, stage 3 S0)
# An owner ruling that settles a contested point for an effort - the entity
# form of today's RESOLVE/DECISION adjudications. Scope is a file:line or a
# class of finding; the ruling text and its source (the owner) are recorded.
[automaton]
name = "Adjudication"
states = ["Active"]
initial = "Active"

allow_indefinite_states = ["Active"]

[[state]]
name = "scope"
type = "string"
initial = ""

[[state]]
name = "ruling"
type = "string"
initial = ""

[[state]]
name = "source"
type = "string"
initial = ""

[[state]]
name = "effort_ref"
type = "string"
initial = ""

[[action]]
name = "Record"
kind = "input"
from = ["Active"]
to = "Active"
params = ["scope", "ruling", "source", "effort_ref"]
hint = "Record an owner ruling scoped to a file:line or a class of finding for an effort."

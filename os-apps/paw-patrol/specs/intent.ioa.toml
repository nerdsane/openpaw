[automaton]
# Intent - human or manager-agent intent submitted into Patrol as work
# (WorkRequest shape, renamed to the SDLC vocabulary; ARN-441). Triage (worth
# doing?) is a different lifecycle than execution (done right?), so Intent stays
# the intake. Accept creates the Effort. Additive: WorkRequest stays until
# the phase-3 flip.
name = "Intent"
states = ["Draft", "Submitted", "Triaged", "Accepted", "Rejected", "Linked"]
initial = "Draft"

allow_indefinite_states = ["Draft", "Accepted", "Rejected", "Linked"]

[[state]]
name = "source"
type = "string"
initial = ""

[[state]]
name = "request_text"
type = "string"
initial = ""

[[state]]
name = "requester_id"
type = "string"
initial = ""

[[state]]
name = "signal_id"
type = "string"
initial = ""

[[state]]
name = "factory_case_id"
type = "string"
initial = ""

[[state]]
name = "pm_issue_id"
type = "string"
initial = ""

[[state]]
name = "triage_summary"
type = "string"
initial = ""

[[state]]
name = "error_message"
type = "string"
initial = ""

# Seed fields for the Effort born at Accept (mapped by the entity trigger below).
[[state]]
name = "task_summary"
type = "string"
initial = ""

[[state]]
name = "task_detail"
type = "string"
initial = ""

[[state]]
name = "risk_lane"
type = "string"
initial = "L0"

[[state]]
name = "repo"
type = "string"
initial = ""

[[state]]
name = "branch"
type = "string"
initial = ""

# Git path to committed intent.md (docs/efforts/<issue>/intent.md). Copied to
# the Effort at birth. Not a Temper File id.
[[state]]
name = "intent_ref"
type = "string"
initial = ""

[[state]]
name = "intent_file_ready"
type = "bool"
initial = "false"

[[action]]
name = "Submit"
kind = "input"
from = ["Draft"]
to = "Submitted"
params = ["source", "request_text", "requester_id"]
hint = "Submit human or manager-agent intent into Patrol as work. (Intake routing generalizes from patrol_request_router in a later step; the Effort is born at Accept.)"

[[action]]
name = "AttachSignal"
kind = "input"
from = ["Submitted", "Triaged"]
params = ["signal_id"]
hint = "Attach an observed signal to this intent. Self-loop (no `to`) - a signal on a Triaged intent must not regress it to Submitted; it stays in its current state."

[[action]]
name = "Triage"
kind = "input"
from = ["Submitted"]
to = "Triaged"
params = ["triage_summary", "task_summary", "task_detail", "risk_lane", "repo", "branch", "intent_ref"]
hint = "Record Patrol triage, the execution seed (task, risk, repo/branch), and the committed intent.md git path before accepting."

[[action]]
name = "AttachIntentFile"
kind = "input"
from = ["Submitted", "Triaged"]
params = ["intent_ref"]
effect = "set intent_file_ready true"
hint = "Name the git path docs/efforts/<issue>/intent.md. chain_github_ready retracts if that path is not on GitHub."

[[action.triggers]]
name = "intent_checks_intent_github"
kind = "wasm"
module = "chain_github_ready"
on_failure = "RetractIntentFile"

[action.triggers.config]
path_field = "intent_ref"
repo_field = "repo"
branch_field = "branch"
github_token = "{secret:github_token}"

[[action]]
name = "RetractIntentFile"
kind = "input"
from = ["Submitted", "Triaged"]
effect = "set intent_file_ready false"
hint = "Callback: intent.md is not on GitHub at repo/branch/path."

[[action]]
name = "Accept"
kind = "input"
from = ["Triaged"]
to = "Accepted"
params = ["factory_case_id"]
guard = "is_true intent_file_ready"
hint = "Accept only when intent.md is on GitHub, and create the Effort."

[[action.triggers]]
name = "intent_accepted_creates_effort"
kind = "entity"
principal = "patrol-intake-service"
to_state = "Accepted"
target_entity = "Effort"
target_action = "Seed"

[action.triggers.params_from]
intent_id = "Id"
intent_ref = "intent_ref"
factory_case_id = "factory_case_id"
task_summary = "task_summary"
task_detail = "task_detail"
risk_lane = "risk_lane"
repo = "repo"
branch = "branch"

[action.triggers.resolve_target]
type = "create"

[[action]]
name = "LinkPmIssue"
kind = "input"
from = ["Accepted", "Linked"]
to = "Linked"
params = ["pm_issue_id"]
hint = "Link the durable paw-pm Issue created or reused by Patrol (Linear mirror)."

[[action]]
name = "Reject"
kind = "input"
from = ["Triaged", "Submitted"]
to = "Rejected"
params = ["triage_summary"]
hint = "Reject an intent that should not become work."

[[state_timeout]]
state = "Submitted"
after_seconds = 86400
on_timeout = "Reject"
params = { triage_summary = "Intent was not triaged within 24h." }

[[state_timeout]]
state = "Triaged"
after_seconds = 86400
on_timeout = "Reject"
params = { triage_summary = "Intent was not accepted or rejected within 24h." }

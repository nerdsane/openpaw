[automaton]
# Intent - human or manager-agent intent submitted into Patrol as work
# (WorkRequest shape, renamed to the SDLC vocabulary; ARN-441). Triage (worth
# doing?) is a different lifecycle than execution (done right?), so Intent stays
# the intake and Accept BIRTHS an Effort. Additive: WorkRequest stays live for the
# paw-codex-worker + dashboard until the phase-3 flip.
name = "Intent"
states = ["Draft", "Submitted", "Triaged", "Accepted", "Rejected", "Linked"]
initial = "Draft"

allow_indefinite_states = ["Draft", "Accepted", "Rejected", "Linked"]

[[state]]
name = "source"
type = "string"
initial = ""

[[state]]
name = "request_text"
type = "string"
initial = ""

[[state]]
name = "requester_id"
type = "string"
initial = ""

[[state]]
name = "signal_id"
type = "string"
initial = ""

[[state]]
name = "factory_case_id"
type = "string"
initial = ""

[[state]]
name = "pm_issue_id"
type = "string"
initial = ""

[[state]]
name = "triage_summary"
type = "string"
initial = ""

[[state]]
name = "error_message"
type = "string"
initial = ""

# Seed fields for the Effort born at Accept (mapped by the entity trigger below).
[[state]]
name = "task_summary"
type = "string"
initial = ""

[[state]]
name = "task_detail"
type = "string"
initial = ""

[[state]]
name = "risk_lane"
type = "string"
initial = "L0"

[[state]]
name = "repo"
type = "string"
initial = ""

[[state]]
name = "branch"
type = "string"
initial = ""

# TemperFS reference to the rendered intent.md; copied to the Effort at birth so
# the design chain starts complete (ARN-441 acceptance: intent.md at birth).
[[state]]
name = "intent_ref"
type = "string"
initial = ""

[[action]]
name = "Submit"
kind = "input"
from = ["Draft"]
to = "Submitted"
params = ["source", "request_text", "requester_id"]
hint = "Submit human or manager-agent intent into Patrol as work. (Intake routing generalizes from patrol_request_router in a later step; the Effort is born at Accept.)"

[[action]]
name = "AttachSignal"
kind = "input"
from = ["Submitted", "Triaged"]
params = ["signal_id"]
hint = "Attach an observed signal to this intent. Self-loop (no `to`) - a signal on a Triaged intent must not regress it to Submitted; it stays in its current state."

[[action]]
name = "Triage"
kind = "input"
from = ["Submitted"]
to = "Triaged"
params = ["triage_summary", "task_summary", "task_detail", "risk_lane", "repo", "branch", "intent_ref"]
hint = "Record Patrol triage, the execution seed (task, risk, repo/branch), and the intent.md reference before accepting."

# Accept BIRTHS the Effort: a declarative entity trigger creates an Effort
# (initial Intended) and dispatches Seed with the intent linkage + task fields.
# `principal` elevates the create to the intake service so the Effort surface can
# be locked to it in Cedar (ordinary agents cannot create an Effort directly).
[[action]]
name = "Accept"
kind = "input"
from = ["Triaged"]
to = "Accepted"
params = ["factory_case_id"]
hint = "Accept this intent and birth its Effort (Intended, intent.md attached at birth)."

[[action.triggers]]
name = "intent_accepted_births_effort"
kind = "entity"
principal = "patrol-intake-service"
to_state = "Accepted"
target_entity = "Effort"
target_action = "Seed"

[action.triggers.params_from]
intent_id = "Id"
intent_ref = "intent_ref"
factory_case_id = "factory_case_id"
task_summary = "task_summary"
task_detail = "task_detail"
risk_lane = "risk_lane"
repo = "repo"
branch = "branch"

[action.triggers.resolve_target]
type = "create"

# Birth-failure repair (ARN-441, review round 1). Accept commits (Triaged ->
# Accepted) and THEN the birth trigger creates the Effort; if that create fails,
# the Intent stays Accepted with no linked Effort. RebirthEffort re-attempts the
# birth (same create trigger). It is a create, so use it ONLY when no Effort
# exists for this Intent yet (query Efforts by intent_id first) - a monitor that
# finds an Accepted Intent with no Effort dispatches this; it must not double-birth.
[[action]]
name = "RebirthEffort"
kind = "input"
from = ["Accepted", "Linked"]
hint = "Re-attempt the Effort birth for an Accepted/Linked Intent that has no linked Effort (repair for a failed birth). Self-loop (no `to`) so it stays in the current state; reachable after LinkPmIssue too. Intake-service only (Cedar)."

[[action.triggers]]
name = "intent_rebirth_effort"
kind = "entity"
principal = "patrol-intake-service"
target_entity = "Effort"
target_action = "Seed"

[action.triggers.params_from]
intent_id = "Id"
intent_ref = "intent_ref"
factory_case_id = "factory_case_id"
task_summary = "task_summary"
task_detail = "task_detail"
risk_lane = "risk_lane"
repo = "repo"
branch = "branch"

[action.triggers.resolve_target]
type = "create"

[[action]]
name = "LinkPmIssue"
kind = "input"
from = ["Accepted", "Linked"]
to = "Linked"
params = ["pm_issue_id"]
hint = "Link the durable paw-pm Issue created or reused by Patrol (Linear mirror)."

[[action]]
name = "Reject"
kind = "input"
from = ["Triaged", "Submitted"]
to = "Rejected"
params = ["triage_summary"]
hint = "Reject an intent that should not become work."

[[state_timeout]]
state = "Submitted"
after_seconds = 86400
on_timeout = "Reject"
params = { triage_summary = "Intent was not triaged within 24h." }

[[state_timeout]]
state = "Triaged"
after_seconds = 86400
on_timeout = "Reject"
params = { triage_summary = "Intent was not accepted or rejected within 24h." }

[automaton]
name = "WorkerRun"
states = ["Queued", "Claimed", "Running", "WaitingForCloudApproval", "CloudApproved", "Done", "Failed", "TimedOut"]
initial = "Queued"

allow_indefinite_states = ["Done", "Failed", "TimedOut"]

[[state]]
name = "worker_id"
type = "string"
initial = ""

[[state]]
name = "allowed_worker_id"
type = "string"
initial = ""

[[state]]
name = "runner_kind"
type = "string"
initial = "local_codex"

[[state]]
name = "provider_id"
type = "string"
initial = "local-codex"

[[state]]
name = "required_capabilities"
type = "string"
initial = "local_codex"

[[state]]
name = "work_cycle_id"
type = "string"
initial = ""

# ARN-441 (additive): when this WorkerRun owns an Effort, effort_id links back so
# WorkerRun.Heartbeat can reset that Effort's ownership lease. Empty for the legacy
# WorkCycle flow (which keeps using work_cycle_id) - untouched until the phase-3 flip.
[[state]]
name = "effort_id"
type = "string"
initial = ""

[[state]]
name = "factory_case_id"
type = "string"
initial = ""

[[state]]
name = "risk_lane"
type = "string"
initial = "L0"

[[state]]
name = "task"
type = "string"
initial = ""

[[state]]
name = "branch_name"
type = "string"
initial = ""

[[state]]
name = "worktree_path"
type = "string"
initial = ""

[[state]]
name = "proof_packet_id"
type = "string"
initial = ""

[[state]]
name = "result_summary"
type = "string"
initial = ""

[[state]]
name = "error_message"
type = "string"
initial = ""

[[state]]
name = "claimed"
type = "bool"
initial = "false"

[[action]]
name = "Configure"
kind = "input"
from = ["Queued"]
to = "Queued"
params = ["work_cycle_id", "effort_id", "factory_case_id", "risk_lane", "task", "branch_name", "worktree_path", "runner_kind", "allowed_worker_id", "provider_id", "required_capabilities"]
hint = "Configure a queued worker run. Patrol uses required_capabilities to route Datadog (datadog_query), GitHub (github_query), implementation, review, and evaluation work to capable agents. effort_id links the owned Effort (ARN-441) for the heartbeat lease."

[[action]]
name = "Claim"
kind = "input"
from = ["Queued"]
to = "Claimed"
params = ["worker_id"]
effect = "set claimed true"
hint = "A registered worker claims this run. Cedar restricts which worker principal can claim."

[[action]]
name = "StartLocal"
kind = "input"
from = ["Claimed"]
to = "Running"
guard = "is_true claimed"
effect = [{ type = "trigger", name = "worker_run_started" }]
hint = "Start local Codex on the registered worker host."

[[action.triggers]]
name = "worker_run_started"
kind = "wasm"
module = "worker_run_lifecycle"
on_failure = "ReportFailed"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "RequestCloudOverflow"
kind = "input"
from = ["Queued", "Claimed"]
to = "WaitingForCloudApproval"
params = ["result_summary"]
hint = "Request manual Codex Cloud overflow. This is never automatic in v1."

[[action]]
name = "ApproveCloudOverflow"
kind = "input"
from = ["WaitingForCloudApproval"]
to = "CloudApproved"
params = ["worker_id"]
hint = "Human approval for Codex Cloud overflow."

[[action]]
name = "DispatchCloud"
kind = "input"
from = ["CloudApproved"]
to = "Running"
params = ["worker_id"]
hint = "Dispatch the approved cloud worker."

# ARN-441 (additive): the owning agent's liveness signal. A self-loop on Running
# (no `to` - stays Running) that entity-triggers Effort.Heartbeat on the owned
# Effort (resolved by effort_id), resetting that Effort's ownership lease clock.
# No-op when effort_id is empty (legacy WorkCycle runs never owned an Effort).
[[action]]
name = "Heartbeat"
kind = "input"
from = ["Running"]
hint = "Owning worker reports liveness; resets the owned Effort's lease (ARN-441)."

[[action.triggers]]
name = "worker_heartbeat_keeps_effort_alive"
kind = "entity"
target_entity = "Effort"
target_action = "Heartbeat"

[action.triggers.guard]
type = "not"

[action.triggers.guard.guard]
type = "field_equals"
field = "effort_id"
value = ""

[action.triggers.params_from]
owner_worker_run_id = "Id"

[action.triggers.resolve_target]
type = "field"
field = "effort_id"

[[action]]
name = "ReportDone"
kind = "input"
from = ["Running"]
to = "Done"
params = ["result_summary", "proof_packet_id", "branch_name"]
effect = [{ type = "trigger", name = "worker_run_finished" }]
hint = "Worker self-reports successful completion with proof."

[[action.triggers]]
name = "worker_run_finished"
kind = "wasm"
module = "worker_run_lifecycle"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "ReportFailed"
kind = "input"
from = ["Claimed", "Running", "WaitingForCloudApproval", "CloudApproved"]
to = "Failed"
params = ["error_message"]
effect = [{ type = "trigger", name = "worker_run_failed" }]
hint = "Worker self-reports a failed run."

[[action.triggers]]
name = "worker_run_failed"
kind = "wasm"
module = "worker_run_lifecycle"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "Timeout"
kind = "input"
from = ["Queued", "Claimed", "Running", "WaitingForCloudApproval", "CloudApproved"]
to = "TimedOut"
params = ["error_message"]
hint = "Timeout safety when a worker stalls or disappears."

[[state_timeout]]
state = "Queued"
after_seconds = 86400
on_timeout = "Timeout"
params = { error_message = "WorkerRun remained queued for 24h." }

[[state_timeout]]
state = "Claimed"
after_seconds = 3600
on_timeout = "Timeout"
params = { error_message = "WorkerRun remained claimed for 1h without starting." }

[[state_timeout]]
state = "Running"
after_seconds = 21600
on_timeout = "Timeout"
params = { error_message = "WorkerRun ran for 6h without self-reporting." }

[[state_timeout]]
state = "WaitingForCloudApproval"
after_seconds = 86400
on_timeout = "Timeout"
params = { error_message = "WorkerRun cloud overflow approval was not resolved within 24h." }

[[state_timeout]]
state = "CloudApproved"
after_seconds = 21600
on_timeout = "Timeout"
params = { error_message = "WorkerRun cloud overflow stayed approved for 6h without dispatch." }

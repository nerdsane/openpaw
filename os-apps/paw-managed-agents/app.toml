name = "paw-managed-agents"
description = "Temper-native managed agents API bridge built on paw-agent and paw-compute"
version = "0.1.0"
dependencies = ["paw-agent", "paw-compute"]

[[wasm_modules]]
name = "session_orchestrator"
criticality = "app-required"
startup_loading = "lazy"

[[wasm_modules]]
name = "event_emitter"
criticality = "app-required"
startup_loading = "lazy"

[[wasm_modules]]
name = "environment_provisioner"
criticality = "app-required"
startup_loading = "lazy"

[[wasm_modules]]
name = "session_terminator"
criticality = "app-required"
startup_loading = "lazy"

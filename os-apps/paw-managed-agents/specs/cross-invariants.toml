version = 1
default_delete_policy = "restrict"

[[invariant]]
name = "SessionRequiresActiveManagedAgent"
kind = "hard"
on = "ManagedSession.*"
assert = 'related(ManagedAgent, AgentId).Status not in ["Archived"]'

[[invariant]]
name = "SessionRequiresActiveEnvironment"
kind = "hard"
on = "ManagedSession.*"
assert = 'related(ManagedEnvironment, EnvironmentId).Status not in ["Archived"]'

[[invariant]]
name = "EventRequiresNonArchivedManagedSession"
kind = "hard"
on = "SessionEvent.*"
assert = 'related(ManagedSession, SessionId).Status not in ["Terminated"] or Kind in ["session.status_terminated"]'

[[invariant]]
name = "ResourceRequiresNonArchivedManagedSession"
kind = "hard"
on = "SessionResource.*"
assert = 'related(ManagedSession, SessionId).Status not in ["Terminated"]'

[[invariant]]
name = "McpServerRequiresActiveManagedAgent"
kind = "hard"
on = "AgentMcpServer.*"
assert = 'related(ManagedAgent, AgentId).Status not in ["Archived"]'

[[invariant]]
name = "SkillRequiresActiveManagedAgent"
kind = "hard"
on = "AgentSkill.*"
assert = 'related(ManagedAgent, AgentId).Status not in ["Archived"]'

[[invariant]]
name = "ToolRequiresActiveManagedAgent"
kind = "hard"
on = "AgentTool.*"
assert = 'related(ManagedAgent, AgentId).Status not in ["Archived"]'

[[invariant]]
name = "PackageRequiresActiveEnvironment"
kind = "hard"
on = "EnvironmentPackage.*"
assert = 'related(ManagedEnvironment, EnvironmentId).Status not in ["Archived"]'

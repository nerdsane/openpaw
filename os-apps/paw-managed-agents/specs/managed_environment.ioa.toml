[automaton]
name = "ManagedEnvironment"
states = ["Active", "Archived"]
initial = "Active"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Active"]

[[state]]
name = "name"
type = "string"
initial = ""

[[state]]
name = "description"
type = "string"
initial = ""

[[state]]
name = "config_type"
type = "string"
initial = "Cloud"

[[state]]
name = "networking_type"
type = "string"
initial = "Unrestricted"

[[state]]
name = "allowed_hosts_json"
type = "string"
initial = "[]"

[[state]]
name = "allow_mcp_servers"
type = "bool"
initial = "false"

[[state]]
name = "allow_package_managers"
type = "bool"
initial = "false"

[[state]]
name = "metadata"
type = "string"
initial = "{}"

[[state]]
name = "archived_at"
type = "string"
initial = ""

[[action]]
name = "Archive"
kind = "input"
from = ["Active"]
to = "Archived"
params = ["ArchivedAt"]
hint = "Archive this managed environment."

[[invariant]]
name = "ArchivedIsFinal"
when = ["Archived"]
assert = "no_further_transitions"

[[field_invariant]]
name = "ConfigTypeMustBeCloud"
when = { not = { field = "ConfigType", absent = true } }
require = { field = "ConfigType", equals = "Cloud" }
message = "ManagedEnvironment.ConfigType must currently be Cloud"

[[field_invariant]]
name = "NetworkingTypeMustBeKnown"
when = { not = { field = "NetworkingType", absent = true } }
require = { any_of = [
  { field = "NetworkingType", equals = "Unrestricted" },
  { field = "NetworkingType", equals = "Limited" },
] }
message = "ManagedEnvironment.NetworkingType must be Unrestricted or Limited"

[[field_invariant]]
name = "ArchivedRequiresArchivedAt"
when = { field = "Status", equals = "Archived" }
require = { any_of = [
  { not = { field = "archived_at", empty = true } },
  { not = { field = "ArchivedAt", empty = true } },
] }
message = "Archived managed environments must set ArchivedAt"

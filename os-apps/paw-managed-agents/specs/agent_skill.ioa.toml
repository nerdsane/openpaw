[automaton]
name = "AgentSkill"
states = ["Active"]
initial = "Active"

[[state]]
name = "agent_id"
type = "string"
initial = ""

[[state]]
name = "skill_id"
type = "string"
initial = ""

[[state]]
name = "skill_type"
type = "string"
initial = "anthropic"

[[state]]
name = "skill_version"
type = "string"
initial = ""

[[field_invariant]]
name = "SkillTypeMustBeKnown"
when = { not = { field = "SkillType", absent = true } }
require = { any_of = [
  { field = "SkillType", equals = "anthropic" },
  { field = "SkillType", equals = "custom" },
] }
message = "AgentSkill.SkillType must be anthropic or custom"

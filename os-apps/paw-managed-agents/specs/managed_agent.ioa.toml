[automaton]
name = "ManagedAgent"
states = ["Active", "Archived"]
initial = "Active"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Active"]

[[state]]
name = "name"
type = "string"
initial = ""

[[state]]
name = "description"
type = "string"
initial = ""

[[state]]
name = "system"
type = "string"
initial = ""

[[state]]
name = "model_id"
type = "string"
initial = ""

[[state]]
name = "provider"
type = "string"
initial = ""

[[state]]
name = "model_speed"
type = "string"
initial = "standard"

[[state]]
name = "version"
type = "counter"
initial = "1"

[[state]]
name = "inner_agent_id"
type = "string"
initial = ""

[[state]]
name = "metadata"
type = "string"
initial = "{}"

[[state]]
name = "archived_at"
type = "string"
initial = ""

[[action]]
name = "BindInnerAgent"
kind = "input"
from = ["Active"]
params = ["InnerAgentId"]
hint = "Record the bridged TemperPaw Agent entity id."

[[action]]
name = "UpdateManagedAgent"
kind = "input"
from = ["Active"]
params = ["Name", "Description", "System", "ModelId", "Provider", "ModelSpeed", "Metadata"]
hint = "Update the managed-agent configuration and increment its version."
effect = [
  { type = "increment", field = "version" },
  { type = "trigger", name = "update_managed_agent" },
]

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "update_managed_agent"
kind = "wasm"
module = "managed_agent_updater"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "SyncComplete"
kind = "input"
from = ["Active"]
hint = "Internal callback used after the managed-agent bridge syncs the inner agent."

[[action]]
name = "Archive"
kind = "input"
from = ["Active"]
to = "Archived"
params = ["ArchivedAt"]
hint = "Archive this managed agent."

[[invariant]]
name = "ArchivedIsFinal"
when = ["Archived"]
assert = "no_further_transitions"

[[invariant]]
name = "VersionIsPositive"
when = ["Active", "Archived"]
assert = "version >= 1"

[[field_invariant]]
name = "ModelSpeedMustBeKnown"
when = { not = { field = "ModelSpeed", absent = true } }
require = { any_of = [
  { field = "ModelSpeed", equals = "standard" },
  { field = "ModelSpeed", equals = "fast" },
] }
message = "ManagedAgent.ModelSpeed must be standard or fast"

[[field_invariant]]
name = "ArchivedRequiresArchivedAt"
when = { field = "Status", equals = "Archived" }
require = { any_of = [
  { not = { field = "archived_at", empty = true } },
  { not = { field = "ArchivedAt", empty = true } },
] }
message = "Archived managed agents must set ArchivedAt"

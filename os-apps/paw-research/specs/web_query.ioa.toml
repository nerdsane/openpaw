# WebQuery — Execute web search or URL fetch as a governed, auditable entity.
#
# One entity type, two WASM modules:
#   - web_search: Exa API search (triggered by Execute when query_type = "search")
#   - web_fetch:  URL fetch + HTML stripping (triggered by Execute when query_type = "fetch")
#
# Agent usage (via dispatch wrappers):
#   temper.web_search("rust async patterns")
#   temper.web_fetch("https://docs.rs/serde_json/latest/serde_json/")

[automaton]
name = "WebQuery"
states = ["Created", "Executing", "Complete", "Failed"]
initial = "Created"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Created", "Executing"]

# --- State Variables ---

[[state]]
name = "query_type"
type = "string"
initial = ""

[[state]]
name = "query"
type = "string"
initial = ""

[[state]]
name = "url"
type = "string"
initial = ""

[[state]]
name = "results"
type = "string"
initial = ""
# Web-fetch results can run up to ~400KB (100K chars in UTF-8 worst case).
# Temper's field-overflow primitive (temper ADR-0040 / ADR-0045) routes
# values above 128KB to the content-addressed blob store and consumers
# resolve via ctx.read_field_string (ADR-0046). No TemperFS File detour.
# `overflow_ttl_seconds` is declared for forward-compatibility with
# temper ADR-0047b (spec-declared TTL wiring); it is inert until that
# lands, after which WebQuery.result blobs expire after 1h.
overflow_ttl_seconds = "3600"

[[state]]
name = "truncated_bytes"
type = "string"
initial = ""
# When web_fetch hits its 10MB upstream cap (WEB_FETCH_MAX_BYTES), the
# original response size is recorded here for observability. Empty means
# no truncation. openpaw ADR-0033.

[[state]]
name = "error"
type = "string"
initial = ""

# --- Actions ---

[[action]]
name = "ExecuteSearch"
kind = "input"
from = ["Created"]
to = "Executing"
params = ["query"]
hint = "Begin a web search query via Exa API."
effect = [{ type = "trigger", name = "execute_search" }]

[[action]]
name = "ExecuteFetch"
kind = "input"
from = ["Created"]
to = "Executing"
params = ["url"]
hint = "Begin fetching a URL and extracting text content."
effect = [{ type = "trigger", name = "execute_fetch" }]

[[action]]
name = "RecordResults"
kind = "input"
from = ["Executing"]
to = "Complete"
params = ["results", "truncated_bytes"]
hint = "WASM module completed successfully; store results. `truncated_bytes` is non-empty when web_fetch hit its 10MB upstream cap."

[[action]]
name = "RecordError"
kind = "input"
from = ["Executing"]
to = "Failed"
params = ["error"]
hint = "WASM module encountered an error."

# --- Invariants ---

[[invariant]]
name = "CompleteIsFinal"
when = ["Complete"]
assert = "no_further_transitions"

[[invariant]]
name = "FailedIsFinal"
when = ["Failed"]
assert = "no_further_transitions"

# --- Integrations ---

[[integration]]
name = "web_search"
trigger = "execute_search"
type = "wasm"
module = "web_search"
on_failure = "RecordError"

[integration.config]
exa_api_key = "{secret:exa_api_key}"

[[integration]]
name = "web_fetch"
trigger = "execute_fetch"
type = "wasm"
module = "web_fetch"
on_failure = "RecordError"

[integration.config]
temper_api_url = "{secret:temper_api_url}"

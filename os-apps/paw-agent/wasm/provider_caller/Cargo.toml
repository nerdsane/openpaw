[package]
name = "provider-caller"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
temper-wasm-sdk = { git = "https://github.com/nerdsane/temper.git", rev = "d94a9df3ba0f6f8163ee443d5d6befea2ddac561" }
session-tree-lib = { path = "../session-tree-lib" }
session-turn-artifacts = { path = "../session-turn-artifacts" }
wasm-helpers = { path = "../wasm-helpers" }
openai-codex-wire = { path = "../openai-codex-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

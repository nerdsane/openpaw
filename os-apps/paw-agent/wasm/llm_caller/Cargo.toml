[package]
name = "llm-caller"
version = "0.1.0"
edition = "2024"

[lib]
# Library-only: consumed by context_preparer, provider_caller, and
# provider_response_applier shims via rlib. The monolithic
# `#[no_mangle] extern "C" fn run` standalone entry was retired when
# the session flow was split into 3 stages.
crate-type = ["rlib"]

[workspace]

[dependencies]
temper-wasm-sdk = { git = "https://github.com/nerdsane/temper.git", branch = "main" }
session-tree-lib = { path = "../session-tree-lib" }
wasm-helpers = { path = "../wasm-helpers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "llm-caller"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[features]
default = ["standalone-wasm"]
standalone-wasm = []

[dependencies]
temper-wasm-sdk = { git = "https://github.com/nerdsane/temper.git", branch = "main" }
session-tree-lib = { path = "../session-tree-lib" }
wasm-helpers = { path = "../wasm-helpers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

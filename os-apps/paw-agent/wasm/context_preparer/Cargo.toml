[package]
name = "context-preparer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
temper-wasm-sdk = { git = "https://github.com/nerdsane/temper.git", rev = "6439a8a0be134ffa37933701fb8fca140121d44d" }
session-tree-lib = { path = "../session-tree-lib" }
session-turn-artifacts = { path = "../session-turn-artifacts" }
tool-catalog = { path = "../tool-catalog" }
wasm-helpers = { path = "../wasm-helpers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

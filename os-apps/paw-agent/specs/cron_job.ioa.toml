# CronJob — Scheduled agent runs (declarative spawn).
#
# Self-scheduling via schedule_at effect. Trigger increments run_count and
# fires cron_compute_next WASM (cron parsing + template substitution).
# TriggerComplete declaratively spawns a Session via the platform's spawn
# effect with copy_fields, then schedules the next Trigger via schedule_at.
# Template substitution supports {{now}}, {{run_count}}, {{last_result}}.

[automaton]
name = "CronJob"
states = ["Created", "Active", "Paused", "Expired"]
initial = "Created"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
allow_indefinite_states = ["Created", "Active", "Paused"]


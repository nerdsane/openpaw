[[action]]
name = "Configure"
kind = "input"
from = ["Created"]
params = ["name", "schedule", "soul_id", "system_prompt", "user_message_template", "model", "provider", "temperature", "tools_enabled", "sandbox_url", "max_turns", "max_runs"]
hint = "Configure the cron job with schedule and agent parameters."

[[action]]
name = "Activate"
kind = "input"
from = ["Created"]
to = "Active"
hint = "Start the cron schedule — computes first next_run_at."
effect = [{ type = "trigger", name = "cron_activate" }]

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "cron_activate"
kind = "wasm"
module = "cron_compute_next"
on_failure = "ActivateFailed"

[action.triggers.config]
mode = "activate"


[[action]]
name = "ActivateComplete"
kind = "input"
from = ["Active"]
params = ["next_run_at"]
hint = "First next_run_at computed. Schedule initial trigger."
effect = [{ type = "schedule_at", field = "next_run_at", action = "Trigger" }]

[[action]]
name = "ActivateFailed"
kind = "input"
from = ["Active"]
params = ["error_message"]
hint = "Activation WASM failed. Entity stays Active but unscheduled."

[[action]]
name = "Pause"
kind = "input"
from = ["Active"]
to = "Paused"
hint = "Pause the cron schedule."

[[action]]
name = "Resume"
kind = "input"
from = ["Paused"]
to = "Active"
hint = "Resume the cron schedule — recomputes next_run_at."
effect = [{ type = "trigger", name = "cron_activate" }]

[[action]]
name = "Trigger"
kind = "input"
from = ["Active"]
params = ["last_run_at"]
hint = "Fire the cron job — increments run count and computes next schedule + user message."
effect = [{ type = "increment", var = "run_count" }, { type = "trigger", name = "cron_compute_next" }]

# ADR-0046: inline trigger — migrated from [[integration]] below.
# Post-parse expansion re-synthesizes the equivalent Integration so
# the existing WASM/webhook runtime handles execution unchanged.
[[action.triggers]]
name = "cron_compute_next"
kind = "wasm"
module = "cron_compute_next"
on_failure = "TriggerFailed"

[action.triggers.config]
mode = "trigger"
default_llm_provider = "{secret:llm_provider}"
default_llm_model = "{secret:llm_model}"


[[action]]
name = "TriggerComplete"
kind = "input"
from = ["Active"]
params = ["next_run_at", "user_message", "model", "provider"]
hint = "Cron computation complete. Spawn Session with copied fields, schedule next run."
effect = [
  { type = "spawn", entity_type = "Session", entity_id_source = "{uuid}", initial_action = "Configure", store_id_in = "last_session_id", copy_fields = "system_prompt,user_message,model,provider,temperature,max_turns,tools_enabled,workdir,sandbox_url,sandbox_id,sandbox_provider,sandbox_networking_type,sandbox_allowed_hosts_json,sandbox_allow_mcp_servers,sandbox_allow_package_managers,sandbox_packages_json,temper_api_url,soul_id,agent_id,reply_channel_id,reply_thread_id,reply_channel_entity_id,reply_channel_type,reply_route_source,parent_session_id,session_depth,max_follow_ups,hook_policy,reserve_tokens,keep_recent_tokens,compaction_model,heartbeat_timeout_seconds,project_harness_id,project_id,workspace_id,conversation_file_id,file_manifest_id,session_file_id,session_leaf_id,session_entries_materialized,prepared_context_file_id,prepared_context_inline_json,system_prompt_hash,system_prompt_file_id,session_mode,gen_ai_parent_trace_id,gen_ai_parent_span_id" },
  { type = "schedule_at", field = "next_run_at", action = "Trigger" },
]

[[action]]
name = "TriggerFailed"
kind = "input"
from = ["Active"]
params = ["error_message"]
hint = "Trigger WASM failed. Stays Active for next scheduled run."

[[action]]
name = "Expire"
kind = "input"
from = ["Active"]
to = "Expired"
hint = "Max runs reached or manually expired."

[[invariant]]
name = "ExpiredIsFinal"
when = ["Expired"]
assert = "no_further_transitions"

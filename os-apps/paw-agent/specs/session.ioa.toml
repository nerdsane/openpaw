# Session Entity — Pi-compatible governed session loop via IOA state machine.
#
# The session turn cycle is expressed as state transitions with WASM integration
# triggers. No Rust while loop — the platform's dispatch pipeline drives
# iteration through callback chaining:
#   Thinking → (call_llm) → ProcessToolCalls → Executing → (run_tools) →
#   HandleToolResults → Thinking → ...
#
# Pi architecture additions:
#   - Session tree: JSONL append-only tree with branching (session_file_id)
#   - Compaction: Thinking → Compacting → Thinking (context_compactor WASM)
#   - Steering: Thinking → Steering → Thinking or Completed (two-loop model)
#   - Soul/Skills/Memory: entity references for identity, capabilities, knowledge
#   - Subagents: parent/child entity relationships via parent_session_id
#   - Heartbeat: liveness monitoring via last_heartbeat_at
#
# Conversation history stored in TemperFS as JSONL session tree.
# Budget enforced via turn_count guard. Tools governed by Cedar.

[automaton]
name = "Session"
states = ["Created", "Provisioning", "Thinking", "Executing", "Compacting", "Steering", "WaitingForApproval", "Completed", "Failed", "Cancelled"]
initial = "Created"

# --- State Variables: Core ---

[[state]]
name = "model"
type = "string"
initial = "claude-sonnet-4-6"

[[state]]
name = "provider"
type = "string"
initial = "anthropic"

[[state]]
name = "conversation_file_id"
type = "string"
initial = ""

[[state]]
name = "workspace_id"
type = "string"
initial = ""

[[state]]
name = "pending_tool_calls"
type = "string"
initial = ""

[[state]]
name = "turn_count"
type = "counter"
initial = "0"

[[state]]
name = "max_turns"
type = "string"
initial = "20"

[[state]]
name = "input_tokens"
type = "counter"
initial = "0"

[[state]]
name = "output_tokens"
type = "counter"
initial = "0"

[[state]]
name = "cost_cents"
type = "string"
initial = "0"

[[state]]
name = "result"
type = "string"
initial = ""

[[state]]
name = "has_result"
type = "bool"
initial = "false"

[[state]]
name = "error_message"
type = "string"
initial = ""

[[state]]
name = "agent_id"
type = "string"
initial = ""

[[state]]
name = "sandbox_url"
type = "string"
initial = ""

[[state]]
name = "temper_api_url"
type = "string"
initial = "http://127.0.0.1:3000"

[[state]]
name = "sandbox_id"
type = "string"
initial = ""

[[state]]
name = "provision_check_count"
type = "counter"
initial = "0"

[[state]]
name = "max_provision_checks"
type = "string"
initial = "24"

[[state]]
name = "file_manifest_id"
type = "string"
initial = ""

[[state]]
name = "workdir"
type = "string"
initial = "/workspace"

[[state]]
name = "tools_enabled"
type = "string"
initial = "temper_create,temper_get,temper_list,temper_action,temper_patch,temper_submit_specs,temper_show_spec,temper_specs,temper_upload_wasm,temper_get_trajectories,temper_get_insights,temper_get_decisions,temper_poll_decision,temper_approve_decision,temper_deny_decision,temper_submit_policy,temper_list_policies,temper_get_policy,temper_update_policy,temper_delete_policy,temper_install_app,temper_list_apps,temper_spawn_session,temper_list_sessions,temper_abort_session,temper_steer_session,temper_save_memory,temper_recall_memory,temper_write,temper_read,temper_run_coding_agent,temper_get_secret,temper_datadog_query,temper_railway,temper_vercel,temper_web_search,temper_web_fetch,read,write,edit,bash"

[[state]]
name = "system_prompt"
type = "string"
initial = ""

[[state]]
name = "user_message"
type = "string"
initial = ""

[[state]]
name = "conversation"
type = "string"
initial = ""

# --- State Variables: Session Tree (Phase 2) ---

[[state]]
name = "session_file_id"
type = "string"
initial = ""

[[state]]
name = "session_leaf_id"
type = "string"
initial = ""

[[state]]
name = "context_tokens"
type = "counter"
initial = "0"

# --- State Variables: Compaction (Phase 3) ---

[[state]]
name = "reserve_tokens"
type = "string"
initial = "20000"

[[state]]
name = "keep_recent_tokens"
type = "string"
initial = "10000"

[[state]]
name = "compaction_count"
type = "counter"
initial = "0"

[[state]]
name = "compaction_model"
type = "string"
initial = ""

# --- State Variables: System Prompt Cache (ADR-0022) ---

[[state]]
name = "system_prompt_hash"
type = "string"
initial = ""

[[state]]
name = "system_prompt_file_id"
type = "string"
initial = ""

[[state]]
name = "gen_ai_parent_trace_id"
type = "string"
initial = ""

[[state]]
name = "gen_ai_parent_span_id"
type = "string"
initial = ""

# --- State Variables: Tool Result Pruning (ADR-0022) ---

[[state]]
name = "prune_tool_results_after_turns"
type = "string"
initial = "4"

# --- State Variables: Steering (Phase 4) ---

[[state]]
name = "steering_messages"
type = "string"
initial = "[]"

[[state]]
name = "follow_up_count"
type = "counter"
initial = "0"

[[state]]
name = "max_follow_ups"
type = "string"
initial = "5"

# --- State Variables: Soul / Skills / Memory (Phase 5) ---

[[state]]
name = "soul_id"
type = "string"
initial = ""

# --- State Variables: REPL State (externalized to TemperFS) ---

[[state]]
name = "repl_file_id"
type = "string"
initial = ""

# --- State Variables: Tool Hooks (Phase 6) ---

[[state]]
name = "hook_policy"
type = "string"
initial = "none"

# --- State Variables: Subagents (Phase 7) ---

[[state]]
name = "parent_session_id"
type = "string"
initial = ""

[[state]]
name = "child_session_ids"
type = "string"
initial = "[]"

[[state]]
name = "session_depth"
type = "counter"
initial = "0"

# --- State Variables: Heartbeat (Phase 8) ---

[[state]]
name = "last_heartbeat_at"
type = "string"
initial = ""

[[state]]
name = "heartbeat_timeout_seconds"
type = "string"
initial = "300"

# --- State Variables: Cedar Approval ---

[[state]]
name = "pending_decision_id"
type = "string"
initial = ""

[[state]]
name = "pending_tool_context"
type = "string"
initial = ""

# --- State Variables: Plan Mode (ADR-004) ---

[[state]]
name = "session_mode"
type = "string"
initial = "execute"

[[state]]
name = "pre_plan_tools_enabled"
type = "string"
initial = ""

[[state]]
name = "active_plan_id"
type = "string"
initial = ""

# --- State Variables: Project Harness ---

[[state]]
name = "project_harness_id"
type = "string"
initial = ""

[[state]]
name = "project_id"
type = "string"
initial = ""

# --- Actions: Core Session Loop ---

[[action]]
name = "Configure"
kind = "input"
from = ["Created"]
params = ["system_prompt", "user_message", "model", "provider", "max_turns", "tools_enabled", "workdir", "sandbox_url", "sandbox_id", "temper_api_url", "soul_id", "parent_session_id", "session_depth", "max_follow_ups", "hook_policy", "reserve_tokens", "keep_recent_tokens", "compaction_model", "heartbeat_timeout_seconds", "project_harness_id", "project_id", "workspace_id", "conversation_file_id", "file_manifest_id", "session_file_id", "session_leaf_id", "session_mode"]
hint = "Configure session. Auto-provisions after configuration. Resume fields (workspace_id, conversation_file_id, session_file_id, session_leaf_id) are accepted so continuations carry prior conversation state."
effect = [{ type = "schedule", action = "ProvisionWorkspace", delay_seconds = 0 }]

[[action]]
name = "ProvisionWorkspace"
kind = "input"
from = ["Created"]
to = "Provisioning"
hint = "Start workspace provisioning (sandbox is lazy — ADR-0022). Triggers workspace_provisioner WASM."
effect = [{ type = "trigger", name = "provision_workspace" }]

[[action]]
name = "WorkspaceReady"
kind = "input"
from = ["Provisioning"]
to = "Thinking"
params = ["workspace_id", "conversation_file_id", "file_manifest_id", "session_file_id", "session_leaf_id"]
hint = "Workspace provisioned. Start LLM loop. Sandbox provisioned lazily on demand (ADR-0022)."
effect = [{ type = "trigger", name = "call_llm" }]

[[action]]
name = "Provision"
kind = "input"
from = ["Created"]
to = "Provisioning"
hint = "Start sandbox provisioning. Used by Resume flow only (lazy sandbox bypasses this for new sessions)."
effect = [{ type = "trigger", name = "provision_sandbox" }]

[[action]]
name = "ProvisionPending"
kind = "input"
from = ["Provisioning"]
to = "Provisioning"
params = ["sandbox_url", "sandbox_id"]
hint = "Sandbox exists but is still booting. Persist connection details and schedule another readiness check."
effect = [
  { type = "increment", var = "provision_check_count" },
  { type = "schedule", action = "CheckSandboxReady", delay_seconds = 5 },
]

[[action]]
name = "CheckSandboxReady"
kind = "input"
from = ["Provisioning"]
to = "Provisioning"
params = []
hint = "Retry sandbox readiness check after a bounded delay."
effect = [{ type = "trigger", name = "provision_sandbox" }]

[[action]]
name = "SandboxReady"
kind = "input"
from = ["Provisioning"]
to = "Thinking"
params = ["sandbox_url", "sandbox_id", "workspace_id", "conversation_file_id", "file_manifest_id", "session_file_id", "session_leaf_id"]
hint = "Callback from sandbox provisioner. Sets sandbox connection, TemperFS workspace/file/manifest/session, and starts think loop."
effect = [{ type = "trigger", name = "call_llm" }]

[[action]]
name = "ProcessToolCalls"
kind = "input"
from = ["Thinking"]
to = "Executing"
params = ["pending_tool_calls", "conversation", "input_tokens", "output_tokens", "session_leaf_id", "context_tokens", "system_prompt_hash", "system_prompt_file_id", "gen_ai_parent_trace_id", "gen_ai_parent_span_id"]
hint = "LLM returned tool_use blocks. Record token usage, transition to Executing, and run tools."
effect = [
  { type = "increment", var = "input_tokens" },
  { type = "increment", var = "output_tokens" },
  { type = "increment", var = "context_tokens" },
  { type = "trigger", name = "run_tools" }
]

[[action]]
name = "HandleToolResults"
kind = "input"
from = ["Executing"]
to = "Thinking"
params = ["pending_tool_calls", "conversation", "session_leaf_id", "repl_file_id", "sandbox_url", "sandbox_id", "system_prompt_hash", "system_prompt_file_id"]
hint = "Tool results received. Increment turn, transition to Thinking, and call LLM again."
effect = [
  { type = "increment", var = "turn_count" },
  { type = "trigger", name = "call_llm" }
]

# --- Actions: Compaction (Phase 3) ---

[[action]]
name = "NeedsCompaction"
kind = "input"
from = ["Thinking"]
to = "Compacting"
params = ["input_tokens", "output_tokens", "system_prompt_hash", "system_prompt_file_id"]
hint = "LLM caller detected context tokens exceeds window minus reserve. Trigger compaction."
effect = [
  { type = "increment", var = "input_tokens" },
  { type = "increment", var = "output_tokens" },
  { type = "trigger", name = "compact_context" }
]

[[action]]
name = "CompactionComplete"
kind = "input"
from = ["Compacting"]
to = "Thinking"
params = ["session_leaf_id", "context_tokens", "system_prompt_hash", "system_prompt_file_id"]
hint = "Compaction finished. Resume LLM call with compacted context."
effect = [
  { type = "increment", var = "compaction_count" },
  { type = "trigger", name = "call_llm" }
]

# --- Actions: Steering (Phase 4) ---

[[action]]
name = "CheckSteering"
kind = "input"
from = ["Thinking"]
to = "Steering"
params = ["input_tokens", "output_tokens", "session_leaf_id", "context_tokens", "system_prompt_hash", "system_prompt_file_id"]
hint = "LLM returned end_turn. Check for queued steering messages before completing."
effect = [
  { type = "increment", var = "input_tokens" },
  { type = "increment", var = "output_tokens" },
  { type = "increment", var = "context_tokens" },
  { type = "trigger", name = "check_steering" }
]

[[action]]
name = "ContinueWithSteering"
kind = "input"
from = ["Steering"]
to = "Thinking"
params = ["session_leaf_id", "steering_messages", "conversation"]
guard = "follow_up_count < 100"
hint = "Steering message found. Inject into conversation and continue. Dynamic max_follow_ups enforced by steering_checker."
effect = [
  { type = "increment", var = "turn_count" },
  { type = "increment", var = "follow_up_count" },
  { type = "trigger", name = "call_llm" }
]

[[action]]
name = "FinalizeResult"
kind = "input"
from = ["Steering"]
to = "Completed"
params = ["result", "conversation", "session_leaf_id"]
hint = "No steering messages queued. Set result and complete."
effect = [
  { type = "set_bool", var = "has_result", value = "true" },
  { type = "trigger", name = "deliver_reply" }
]

[[action]]
name = "Steer"
kind = "input"
from = ["Thinking", "Executing", "Steering", "Compacting", "WaitingForApproval"]
params = ["steering_messages"]
hint = "Queue a steering message for mid-run injection. External callers append messages while session runs. Self-loop — does not change state."

[[action]]
name = "SwitchProvider"
kind = "input"
from = ["Thinking", "Executing", "Steering", "Compacting", "WaitingForApproval", "Provisioning"]
params = ["model", "provider"]
hint = "Change LLM provider and/or model mid-session. Self-loop — takes effect on the next LLM call. Callable by the session itself or by parent/supervisor."

# --- Actions: Plan Mode (ADR-004) ---

[[action]]
name = "SwitchMode"
kind = "input"
from = ["Thinking", "Executing", "Steering", "Compacting", "WaitingForApproval", "Provisioning"]
params = ["session_mode", "tools_enabled", "pre_plan_tools_enabled", "active_plan_id"]
hint = "Switch between plan and execute modes. Self-loop — takes effect on next tool call."

[[action]]
name = "PauseForPlanApproval"
kind = "input"
from = ["Thinking", "Executing"]
to = "WaitingForApproval"
params = ["active_plan_id", "pending_tool_context"]
hint = "Pause session until Plan is approved. Triggered by agent after SubmitForReview."
effect = [{ type = "trigger", name = "notify_plan_approval_needed" }]

[[action]]
name = "ResumeWithPlanApproval"
kind = "input"
from = ["WaitingForApproval"]
to = "Thinking"
params = ["session_mode", "tools_enabled", "pre_plan_tools_enabled"]
hint = "Plan approved. Switch to execute mode and resume LLM loop."
effect = [{ type = "trigger", name = "call_llm" }]

# --- Actions: Cedar Approval Pause-Resume ---

[[action]]
name = "PauseForApproval"
kind = "input"
from = ["Executing"]
to = "WaitingForApproval"
params = ["pending_decision_id", "pending_tool_context"]
hint = "Cedar denied a tool call. Session pauses cleanly until human approves via Discord."
effect = [{ type = "trigger", name = "notify_approval_needed" }]

[[action]]
name = "ResumeAfterApproval"
kind = "input"
from = ["WaitingForApproval"]
to = "Executing"
hint = "Human approved the Cedar decision. Resume tool execution with same pending_tool_calls."
effect = [{ type = "trigger", name = "run_tools" }]

# --- Actions: Legacy direct completion (backward compat for max_follow_ups=0) ---

[[action]]
name = "RecordResult"
kind = "input"
from = ["Thinking", "Executing"]
to = "Completed"
params = ["result", "conversation", "input_tokens", "output_tokens", "session_leaf_id", "repl_file_id", "system_prompt_hash", "system_prompt_file_id"]
hint = "Session complete. Triggered by LLM end_turn or agent calling temper.done(result)."
effect = [
  { type = "increment", var = "input_tokens" },
  { type = "increment", var = "output_tokens" },
  { type = "set_bool", var = "has_result", value = "true" },
  { type = "trigger", name = "deliver_reply" }
]

# --- Actions: Heartbeat (Phase 8) ---

[[action]]
name = "Heartbeat"
kind = "input"
from = ["Thinking", "Executing", "Steering", "Compacting", "WaitingForApproval"]
params = ["last_heartbeat_at"]
hint = "Record session liveness. Called by WASM modules during long operations. Self-loop."
effect = [{ type = "trigger", name = "heartbeat_typing" }]

[[action]]
name = "TimeoutFail"
kind = "input"
from = ["Thinking", "Executing", "Steering", "Compacting"]
to = "Failed"
params = ["error_message"]
hint = "Session timed out — no heartbeat within timeout period."
effect = [{ type = "trigger", name = "deliver_reply" }]

# --- Actions: Failure, Cancellation, Resume ---

[[action]]
name = "Fail"
kind = "input"
from = ["Created", "Provisioning", "Thinking", "Executing", "Compacting", "Steering", "WaitingForApproval"]
to = "Failed"
params = ["error_message"]
hint = "Mark session run as failed."
effect = [{ type = "trigger", name = "deliver_reply" }]

[[action]]
name = "Cancel"
kind = "input"
from = ["Created", "Provisioning", "Thinking", "Executing", "Compacting", "Steering", "WaitingForApproval"]
to = "Cancelled"
hint = "Cancel session execution."
effect = [{ type = "trigger", name = "deliver_reply" }]

[[action]]
name = "DeliveryFailed"
kind = "input"
from = ["Completed", "Failed", "Cancelled"]
params = ["error_message"]
hint = "Reply delivery failed after the session reached a terminal state."

[[action]]
name = "Resume"
kind = "input"
from = ["Created"]
to = "Provisioning"
params = ["sandbox_url", "sandbox_id", "workspace_id", "conversation_file_id", "file_manifest_id", "session_file_id", "session_leaf_id"]
hint = "Resume session from saved state. Transitions to Provisioning for workspace restore."
effect = [{ type = "trigger", name = "restore_workspace" }]

# --- Invariants ---

[[invariant]]
name = "CompletedHasResult"
when = ["Completed"]
assert = "has_result"

# Note: Completed/Failed/Cancelled are terminal for the session loop, but
# DeliveryFailed is a valid self-loop action from terminal states to record
# delivery failures. So we do NOT assert no_further_transitions.

[[invariant]]
name = "TurnCountNonNegative"
when = ["Created", "Provisioning", "Thinking", "Executing", "Compacting", "Steering", "WaitingForApproval", "Completed", "Failed", "Cancelled"]
assert = "turn_count >= 0"

# --- Integrations ---

[[integration]]
name = "provision_workspace"
trigger = "provision_workspace"
type = "wasm"
module = "workspace_provisioner"
on_failure = "Fail"

[integration.config]
temper_api_url = "{secret:temper_api_url}"

[[integration]]
name = "provision_sandbox"
trigger = "provision_sandbox"
type = "wasm"
module = "sandbox_provisioner"
on_failure = "Fail"

[integration.config]
temper_api_url = "{secret:temper_api_url}"
sandbox_url = "{secret:sandbox_url}"
tensorlake_api_key = "{secret:tensorlake_api_key}"

[[integration]]
name = "call_llm"
trigger = "call_llm"
type = "wasm"
module = "llm_caller"
on_failure = "Fail"

[integration.config]
api_key = "{secret:anthropic_api_key}"
anthropic_api_key = "{secret:anthropic_api_key}"
openai_codex_token = "{secret:openai_codex_token}"
openrouter_api_key = "{secret:openrouter_api_key}"
anthropic_api_url = "https://api.anthropic.com/v1/messages"
openai_api_url = "https://chatgpt.com/backend-api/codex/responses"
openrouter_api_url = "https://openrouter.ai/api/v1/chat/completions"
anthropic_auth_mode = "auto"
openrouter_site_url = ""
openrouter_app_name = "openpaw-agent"
temper_api_url = "{secret:temper_api_url}"
timeout_secs = "600"
max_response_bytes = "4194304"

[[integration]]
name = "run_tools"
trigger = "run_tools"
type = "wasm"
module = "monty_repl"
on_failure = "Fail"

[integration.config]
temper_api_url = "{secret:temper_api_url}"
tensorlake_api_key = "{secret:tensorlake_api_key}"
timeout_secs = "900"
max_fuel = "50000000000"
max_memory = "268435456"
max_response_bytes = "16777216"
spawn_session_wait_timeout_ms = "840000"
max_sync_file_bytes = "61440"
max_sync_files = "64"
sync_exclude = "__pycache__,node_modules,.git,.next,dist,build,target,coverage,venv,.venv"
dd_api_key = "{secret:dd_api_key}"
dd_app_key = "{secret:dd_app_key}"
dd_site = "{secret:dd_site}"
railway_token = "{secret:railway_token}"
vercel_token = "{secret:vercel_token}"

[[integration]]
name = "compact_context"
trigger = "compact_context"
type = "wasm"
module = "context_compactor"
on_failure = "Fail"

[integration.config]
api_key = "{secret:anthropic_api_key}"
temper_api_url = "{secret:temper_api_url}"
timeout_secs = "120"

[[integration]]
name = "check_steering"
trigger = "check_steering"
type = "wasm"
module = "steering_checker"
on_failure = "Fail"

[integration.config]
temper_api_url = "{secret:temper_api_url}"

[[integration]]
name = "restore_workspace"
trigger = "restore_workspace"
type = "wasm"
module = "workspace_restorer"
on_failure = "Fail"

[integration.config]
temper_api_url = "{secret:temper_api_url}"
tensorlake_api_key = "{secret:tensorlake_api_key}"

[[integration]]

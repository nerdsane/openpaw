type = "wasm"
module = "request_approval"

[integration.config]
temper_api_url = "{secret:temper_api_url}"

[[integration]]
name = "heartbeat_typing"
trigger = "heartbeat_typing"
type = "wasm"
module = "heartbeat_typing"

[integration.config]
temper_api_url = "{secret:temper_api_url}"

[[integration]]
name = "notify_plan_approval_needed"
trigger = "notify_plan_approval_needed"
type = "wasm"
module = "request_approval"

[integration.config]
temper_api_url = "{secret:temper_api_url}"

# PendingApproval — One-time Cedar authorization approval request.
#
# Event-driven flow (no polling, no blocking):
# 1. Agent hits Cedar 403 → tool_runner creates PendingApproval → returns immediately
# 2. Request action triggers request_approval WASM → sends Discord buttons
# 3. Human clicks Approve → Approve action triggers approval_granted WASM
# 4. approval_granted WASM executes the denied action (system identity) and notifies Discord

[automaton]
name = "PendingApproval"
states = ["Pending", "Approved", "Denied", "Expired"]
initial = "Pending"

# --- State Variables ---

[[state]]
name = "agent_entity_id"
type = "string"
initial = ""

[[state]]
name = "action_description"
type = "string"
initial = ""

[[state]]
name = "entity_set"
type = "string"
initial = ""

[[state]]
name = "target_entity_id"
type = "string"
initial = ""

[[state]]
name = "target_action"
type = "string"
initial = ""

[[state]]
name = "target_body"
type = "string"
initial = ""

[[state]]
name = "target_url"
type = "string"
initial = ""

[[state]]
name = "decision_id"
type = "string"
initial = ""

[[state]]
name = "reviewer_id"
type = "string"
initial = ""

[[state]]
name = "result"
type = "string"
initial = ""

# --- Actions ---

[[action]]
name = "Request"
kind = "input"
from = ["Pending"]
params = ["agent_entity_id", "action_description", "entity_set", "target_entity_id", "target_action", "target_body", "target_url", "decision_id"]
hint = "Configure the approval request. Triggers Discord buttons."
effect = [{ type = "trigger", name = "request_approval" }]

[[action]]
name = "Approve"
kind = "input"
from = ["Pending"]
to = "Approved"
params = ["reviewer_id"]
hint = "Human approved. Triggers retry of the denied action."
effect = [{ type = "trigger", name = "approval_granted" }]

[[action]]
name = "Deny"
kind = "input"
from = ["Pending"]
to = "Denied"
params = ["reviewer_id"]
hint = "Human denied the action via Discord button."

[[action]]
name = "Expire"
kind = "input"
from = ["Pending"]
to = "Expired"
hint = "Approval request expired without a decision."

# --- Integrations ---

[[integration]]
name = "request_approval"
trigger = "request_approval"
type = "wasm"
module = "request_approval"

[integration.config]
temper_api_url = "{secret:temper_api_url}"

[[integration]]
name = "approval_granted"
trigger = "approval_granted"
type = "wasm"
module = "approval_granted"

[integration.config]
temper_api_url = "{secret:temper_api_url}"

# AlertCycle — One self-healing attempt opened from a monitor alert.

[automaton]
name = "AlertCycle"
states = ["Created", "Triaging", "Fixed", "Merging", "Deploying", "Verifying", "Resolved", "Tuned", "Failed"]
initial = "Created"

[[state]]
name = "monitor_id"
type = "string"
initial = ""

[[state]]
name = "alert_payload"
type = "string"
initial = ""

[[state]]
name = "diagnosis"
type = "string"
initial = ""

[[state]]
name = "pr_url"
type = "string"
initial = ""

[[state]]
name = "sre_agent_id"
type = "string"
initial = ""

[[state]]
name = "developer_agent_id"
type = "string"
initial = ""

[[state]]
name = "tuning_notes"
type = "string"
initial = ""

[[state]]
name = "merge_sha"
type = "string"
initial = ""

[[state]]
name = "deployment_url"
type = "string"
initial = ""

[[action]]
name = "Open"
kind = "input"
from = ["Created"]
to = "Triaging"
params = ["monitor_id", "alert_payload", "sre_agent_id"]
hint = "Open a triage cycle and optionally attach the SRE agent responsible for diagnosis."

[[action]]
name = "HealComplete"
kind = "input"
from = ["Triaging"]
to = "Fixed"
params = ["diagnosis", "pr_url", "developer_agent_id"]
hint = "Mark the alert as fixed and record the remediation PR."

[[action]]
name = "BeginMerge"
kind = "input"
from = ["Fixed"]
to = "Merging"
params = ["pr_url"]
hint = "Begin the merge phase after a fix PR is ready."

[[action]]
name = "MergeComplete"
kind = "input"
from = ["Merging"]
to = "Deploying"
params = ["merge_sha"]
hint = "Record the merge SHA and transition into deployment tracking."

[[action]]
name = "DeployDetected"
kind = "input"
from = ["Deploying"]
to = "Verifying"
params = ["deployment_url"]
hint = "Record the deployment target that should be verified after merge."

[[action]]
name = "AlertResolved"
kind = "input"
from = ["Fixed", "Deploying", "Verifying"]
to = "Resolved"
params = ["diagnosis"]
hint = "Mark the alert resolved after post-deploy verification succeeds."

[[action]]
name = "AlertPersists"
kind = "input"
from = ["Fixed", "Merging", "Deploying", "Verifying"]
to = "Failed"
params = ["diagnosis"]
hint = "Mark the alert failed after deployment when the signal still persists."

[[action]]
name = "TuneComplete"
kind = "input"
from = ["Triaging"]
to = "Tuned"
params = ["diagnosis", "tuning_notes"]
hint = "Mark the cycle as tuned when the monitor was adjusted instead of code being changed."

[[action]]
name = "Escalate"
kind = "input"
from = ["Triaging"]
to = "Failed"
params = ["diagnosis"]
hint = "Escalate when the loop cannot safely remediate the issue."

[[invariant]]
name = "ResolvedIsFinal"
when = ["Resolved"]
assert = "no_further_transitions"

[[invariant]]
name = "TunedIsFinal"
when = ["Tuned"]
assert = "no_further_transitions"

[[invariant]]
name = "FailedIsFinal"
when = ["Failed"]
assert = "no_further_transitions"

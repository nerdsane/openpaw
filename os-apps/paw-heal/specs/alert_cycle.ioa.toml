# AlertCycle — One self-healing attempt opened from a monitor alert.

[automaton]
name = "AlertCycle"
states = ["Created", "Triaging", "Fixed", "Merging", "Deploying", "Verifying", "Resolved", "Tuned", "Failed"]
initial = "Created"

[[state]]
name = "monitor_id"
type = "string"
initial = ""

[[state]]
name = "alert_payload"
type = "string"
initial = ""

[[state]]
name = "diagnosis"
type = "string"
initial = ""

[[state]]
name = "pr_url"
type = "string"
initial = ""

[[state]]
name = "sre_agent_id"
type = "string"
initial = ""

[[state]]
name = "developer_agent_id"
type = "string"
initial = ""

[[state]]
name = "tuning_notes"
type = "string"
initial = ""

[[state]]
name = "merge_sha"
type = "string"
initial = ""

[[state]]
name = "deployment_url"
type = "string"
initial = ""

[[state]]
name = "check_count"
type = "string"
initial = "0"

[[state]]
name = "report_channel_entity_id"
type = "string"
initial = ""

[[state]]
name = "report_thread_id"
type = "string"
initial = ""

[[action]]
name = "Open"
kind = "input"
from = ["Created"]
to = "Triaging"
params = ["monitor_id", "alert_payload", "report_channel_entity_id", "report_thread_id"]
hint = "Open a triage cycle and optionally attach the SRE agent responsible for diagnosis."
effect = [{ type = "trigger", name = "spawn_sre" }]

[[action]]
name = "HealComplete"
kind = "input"
from = ["Triaging"]
to = "Fixed"
params = ["diagnosis", "pr_url", "developer_agent_id"]
hint = "Mark the alert as fixed and record the remediation PR."
effect = [{ type = "trigger", name = "begin_cicd" }]

[[action]]
name = "BeginMerge"
kind = "input"
from = ["Fixed"]
to = "Merging"
params = ["pr_url"]
hint = "Begin the merge phase after a fix PR is ready."
effect = [{ type = "trigger", name = "check_merge_ready" }]

[[action]]
name = "MergeComplete"
kind = "input"
from = ["Merging"]
to = "Deploying"
params = ["merge_sha"]
hint = "Record the merge SHA and transition into deployment tracking."
effect = [{ type = "trigger", name = "check_deployment" }]

[[action]]
name = "DeployDetected"
kind = "input"
from = ["Deploying"]
to = "Verifying"
params = ["deployment_url"]
hint = "Record the deployment target that should be verified after merge."
effect = [{ type = "trigger", name = "check_alert_resolution" }]

[[action]]
name = "AlertResolved"
kind = "input"
from = ["Fixed", "Deploying", "Verifying"]
to = "Resolved"
params = ["diagnosis"]
hint = "Mark the alert resolved after post-deploy verification succeeds."
effect = [{ type = "trigger", name = "report_outcome" }]

[[action]]
name = "AlertPersists"
kind = "input"
from = ["Fixed", "Merging", "Deploying", "Verifying"]
to = "Failed"
params = ["diagnosis"]
hint = "Mark the alert failed after deployment when the signal still persists."
effect = [{ type = "trigger", name = "report_outcome" }]

[[action]]
name = "TuneComplete"
kind = "input"
from = ["Triaging"]
to = "Tuned"
params = ["diagnosis", "tuning_notes"]
hint = "Mark the cycle as tuned when the monitor was adjusted instead of code being changed."
effect = [{ type = "trigger", name = "report_outcome" }]

[[action]]
name = "Escalate"
kind = "input"
from = ["Triaging"]
to = "Failed"
params = ["diagnosis"]
hint = "Escalate when the loop cannot safely remediate the issue."
effect = [{ type = "trigger", name = "report_outcome" }]

[[action]]
name = "CheckMergeReady"
kind = "internal"
from = ["Merging"]
to = "Merging"
params = []
hint = "Poll GitHub PR merge readiness. Self-loops until checks pass or max_checks exceeded."
effect = [{ type = "trigger", name = "check_merge_ready" }]

[[action]]
name = "CheckDeployment"
kind = "internal"
from = ["Deploying"]
to = "Deploying"
params = []
hint = "Poll GitHub deployments API for success."
effect = [{ type = "trigger", name = "check_deployment" }]

[[action]]
name = "CheckAlertResolution"
kind = "internal"
from = ["Verifying"]
to = "Verifying"
params = []
hint = "Poll monitoring API for alert resolution."
effect = [{ type = "trigger", name = "check_alert_resolution" }]

[[invariant]]
name = "ResolvedIsFinal"
when = ["Resolved"]
assert = "no_further_transitions"

[[invariant]]
name = "TunedIsFinal"
when = ["Tuned"]
assert = "no_further_transitions"

[[invariant]]
name = "FailedIsFinal"
when = ["Failed"]
assert = "no_further_transitions"

[[integration]]
name = "spawn_sre"
trigger = "spawn_sre"
type = "wasm"
module = "alert_opener"
on_failure = "Escalate"

[integration.config]
temper_api_url = "{secret:temper_api_url}"
default_agent_model = "claude-sonnet-4-6"
default_sre_workdir = "/tmp/openpaw-sre-webhook"
default_developer_workdir = "/tmp/openpaw-self-heal"

[[integration]]
name = "begin_cicd"
trigger = "begin_cicd"
type = "wasm"
module = "cicd_initiator"
on_failure = "Escalate"

[integration.config]
temper_api_url = "{secret:temper_api_url}"

[[integration]]
name = "check_merge_ready"
trigger = "check_merge_ready"
type = "wasm"
module = "cicd_merger"
on_failure = "AlertPersists"

[integration.config]
github_token = "{secret:github_token}"
temper_api_url = "{secret:temper_api_url}"
max_checks = "40"

[[integration]]
name = "check_deployment"
trigger = "check_deployment"
type = "wasm"
module = "deployment_tracker"
on_failure = "AlertPersists"

[integration.config]
github_token = "{secret:github_token}"
temper_api_url = "{secret:temper_api_url}"
max_checks = "40"

[[integration]]
name = "check_alert_resolution"
trigger = "check_alert_resolution"
type = "wasm"
module = "alert_verifier"
on_failure = "AlertPersists"

[integration.config]
dd_api_key = "{secret:dd_api_key}"
dd_app_key = "{secret:dd_app_key}"
dd_site = "{secret:dd_site}"
temper_api_url = "{secret:temper_api_url}"
max_checks = "5"

[[integration]]
name = "report_outcome"
trigger = "report_outcome"
type = "wasm"
module = "heal_reporter"

[integration.config]
temper_api_url = "{secret:temper_api_url}"

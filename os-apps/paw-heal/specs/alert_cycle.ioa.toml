# AlertCycle — One self-healing attempt opened from a monitor alert.
#
# Full lifecycle: Created → Triaging → Fixed → Merging → Deploying → Verifying → Resolved
# Alternate terminal states: Tuned (noise), Failed (unrecoverable)

[automaton]
name = "AlertCycle"
states = ["Created", "Triaging", "Fixed", "Merging", "Deploying", "Verifying", "Resolved", "Tuned", "Failed"]
initial = "Created"

[[state]]
name = "monitor_id"
type = "string"
initial = ""

[[state]]
name = "alert_payload"
type = "string"
initial = ""

[[state]]
name = "diagnosis"
type = "string"
initial = ""

[[state]]
name = "pr_url"
type = "string"
initial = ""

[[state]]
name = "sre_agent_id"
type = "string"
initial = ""

[[state]]
name = "developer_agent_id"
type = "string"
initial = ""

[[state]]
name = "tuning_notes"
type = "string"
initial = ""

[[state]]
name = "merge_sha"
type = "string"
initial = ""

[[state]]
name = "deployment_url"
type = "string"
initial = ""

# --- Triage phase ---

[[action]]
name = "Open"
kind = "input"
from = ["Created"]
to = "Triaging"
params = ["monitor_id", "alert_payload", "sre_agent_id"]
hint = "Open a triage cycle and optionally attach the SRE agent responsible for diagnosis."

[[action]]
name = "HealComplete"
kind = "input"
from = ["Triaging"]
to = "Fixed"
params = ["diagnosis", "pr_url", "developer_agent_id"]
hint = "Mark the alert as fixed and record the remediation PR."

[[action]]
name = "TuneComplete"
kind = "input"
from = ["Triaging"]
to = "Tuned"
params = ["diagnosis", "tuning_notes"]
hint = "Mark the cycle as tuned when the monitor was adjusted instead of code being changed."

[[action]]
name = "Escalate"
kind = "input"
from = ["Triaging"]
to = "Failed"
params = ["diagnosis"]
hint = "Escalate when the loop cannot safely remediate the issue."

# --- CI/CD closure phase ---

[[action]]
name = "BeginMerge"
kind = "input"
from = ["Fixed"]
to = "Merging"
params = ["pr_url"]
hint = "Begin the merge process after CI checks pass on the remediation PR."

[[action]]
name = "MergeComplete"
kind = "input"
from = ["Merging"]
to = "Deploying"
params = ["merge_sha"]
hint = "Record the merge commit SHA after the PR is merged."

[[action]]
name = "DeployDetected"
kind = "input"
from = ["Deploying"]
to = "Verifying"
params = ["deployment_url"]
hint = "Record that the deployment has been detected (Vercel, Railway, etc.)."

[[action]]
name = "AlertResolved"
kind = "input"
from = ["Verifying"]
to = "Resolved"
params = ["diagnosis"]
hint = "The Datadog monitor confirms the alert is resolved post-deploy."

[[action]]
name = "AlertPersists"
kind = "input"
from = ["Verifying"]
to = "Failed"
params = ["diagnosis"]
hint = "The alert persists after deployment — the fix did not resolve the issue."

# --- Terminal state invariants ---

[[invariant]]
name = "ResolvedIsFinal"
when = ["Resolved"]
assert = "no_further_transitions"

[[invariant]]
name = "TunedIsFinal"
when = ["Tuned"]
assert = "no_further_transitions"

[[invariant]]
name = "FailedIsFinal"
when = ["Failed"]
assert = "no_further_transitions"

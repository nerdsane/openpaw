# Monitor — Datadog-backed watch for a self-healing target.

[automaton]
name = "Monitor"
states = ["Created", "Active", "Paused", "Archived"]
initial = "Created"

[[state]]
name = "dd_query"
type = "string"
initial = ""

[[state]]
name = "threshold"
type = "string"
initial = "1"

[[state]]
name = "dd_monitor_id"
type = "string"
initial = ""

[[state]]
name = "last_alert_payload"
type = "string"
initial = ""

[[state]]
name = "alert_count"
type = "counter"
initial = "0"

[[action]]
name = "Configure"
kind = "input"
from = ["Created", "Paused"]
params = ["dd_query", "threshold", "dd_monitor_id"]
hint = "Configure the Datadog query and threshold used to detect incidents."

[[action]]
name = "Activate"
kind = "input"
from = ["Created", "Paused"]
to = "Active"
hint = "Turn on monitoring after the query has been configured."

[[action]]
name = "AlertFired"
kind = "input"
from = ["Active"]
params = ["last_alert_payload"]
effect = "increment alert_count"
hint = "Record an alert payload while keeping the monitor active."

[[action]]
name = "Tune"
kind = "input"
from = ["Active", "Paused"]
to = "Active"
params = ["dd_query", "threshold", "dd_monitor_id"]
hint = "Adjust query or threshold after an alert cycle completes."

[[action]]
name = "Pause"
kind = "input"
from = ["Active"]
to = "Paused"
hint = "Pause monitoring without archiving it."

[[action]]
name = "Archive"
kind = "input"
from = ["Created", "Active", "Paused"]
to = "Archived"
hint = "Archive the monitor when it is no longer needed."

[[invariant]]
name = "ArchivedIsFinal"
when = ["Archived"]
assert = "no_further_transitions"

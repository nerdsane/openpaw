# ArtifactBatch Entity — I/O Automaton Specification
#
# Temper-native workflow for applying a multi-file artifact manifest. The
# batch owns workflow progress while individual Directory/File/FileVersion
# entities own filesystem state.

[automaton]
name = "ArtifactBatch"
states = ["Submitted", "Applying", "Completed", "Failed"]
initial = "Submitted"
allow_indefinite_states = ["Submitted", "Applying"]

[[state]]
name = "file_count"
type = "counter"
initial = "0"

[[state]]
name = "applied_count"
type = "counter"
initial = "0"

[[state]]
name = "failed_count"
type = "counter"
initial = "0"

[[state]]
name = "total_bytes"
type = "counter"
initial = "0"

[[state]]
name = "workspace_id"
type = "string"
initial = ""

[[state]]
name = "files_manifest"
type = "string"
initial = ""

[[state]]
name = "last_error"
type = "string"
initial = ""

[[action]]
name = "Submit"
kind = "input"
from = ["Submitted"]
to = "Submitted"
params = ["workspace_id", "files_manifest", "submitted_by", "file_count"]
effect = [
  { type = "set_counter_from_param", var = "file_count", param = "file_count" },
]
hint = "Submit a JSON file manifest for batch application."

[[action]]
name = "Apply"
kind = "input"
from = ["Submitted"]
to = "Applying"
effect = [{ type = "trigger", name = "artifact_batch_apply" }]
hint = "Apply the submitted manifest using direct Directory/File/FileVersion operations."

[[action.triggers]]
name = "artifact_batch_apply"
kind = "wasm"
module = "artifact_batch_apply"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "RecordFileApplied"
kind = "input"
from = ["Applying"]
to = "Applying"
params = ["path", "file_id", "size_bytes"]
effect = [
  { type = "increment", var = "applied_count" },
  { type = "increment", var = "total_bytes", amount = "size_bytes" },
]
hint = "Record one file applied by the batch integration."

[[action]]
name = "RecordFileFailed"
kind = "input"
from = ["Applying"]
to = "Applying"
params = ["path", "error"]
effect = [{ type = "increment", var = "failed_count" }]
hint = "Record one failed file application."

[[action]]
name = "Complete"
kind = "input"
from = ["Applying"]
to = "Completed"
params = ["usage_bucket_id"]
hint = "Mark the batch completed after files and usage delta are recorded."

[[action]]
name = "Fail"
kind = "input"
from = ["Submitted", "Applying"]
to = "Failed"
params = ["error"]
hint = "Mark the batch failed with a diagnostic error."

[[invariant]]
name = "CompletedIsFinal"
when = ["Completed"]
assert = "no_further_transitions"

[[invariant]]
name = "FailedIsFinal"
when = ["Failed"]
assert = "no_further_transitions"

[[invariant]]
name = "AppliedCountNonNegative"
when = ["Submitted", "Applying", "Completed", "Failed"]
assert = "applied_count >= 0"

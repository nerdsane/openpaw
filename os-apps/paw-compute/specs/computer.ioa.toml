# Computer — Persistent cloud VM for developer agents.
#
# A Computer represents a long-lived Linux VM (e.g., Fly.io Sprite)
# that an agent uses as its development environment. The VM persists
# across agent runs — code, dependencies, and state survive restarts.
#
# Lifecycle: Created → Provisioning → Ready ↔ Sleeping → Destroyed
#            Ready → Checkpointing → Ready (checkpoint in place)

[automaton]
name = "Computer"
# Leased is the CHILD-COPY lifecycle state (ARN-443 C): a live copy of a source
# computer lands in Leased (never Ready), so a lease `state_timeout` can reap
# copies without ever touching a source — sources stay in Ready
# (allow_indefinite) and are structurally unreapable. State carries the "this is
# a leased copy" semantics; there is no is_copy flag.
# ARN-443 D (DONE): panel execs route through Exec rows, and computer_exec_start's
# live-gate accepts "Leased" as well as "Ready" so a governed exec runs on a copy
# (a panel copy lives in Leased, never Ready). See computer_exec_start handle_from_computer.
#
# ARN-443 C5 (async copy, structural): a copy of a SOURCE is serialized at the
# ENTITY level. Copy moves the source Ready -> CopyInFlight (a self-lock); while
# CopyInFlight the source is not Ready, so a second Copy cannot fire — the state
# machine GUARANTEES at most one governed copy per source in flight (no provider-
# list race to detect concurrency after the fact). The lock releases (CopyInFlight
# -> Ready) as soon as the in-flight child OWNS its own copy machine (or has
# failed), watched by the source itself (computer_copy_lock_poll on a CopyInFlight
# self-loop — the source sequences its own unlock from a read; the module never
# dispatches cross-entity). See docs/efforts/ARN-443/decisions.md.
states = ["Created", "Provisioning", "Copying", "CopyInFlight", "Ready", "Checkpointing", "Sleeping", "Leased", "Terminating", "Destroyed"]
initial = "Created"

# ADR-0050 migration TODO: each state below needs either a
# [[state_timeout]] declaration or a domain-specific justification
# for being indefinite. Added as a migration allowlist to unblock
# TEMPER_LIVENESS_ENFORCE=true; revisit and tune per state.
# (CopyInFlight is NOT indefinite — it carries a [[state_timeout]] poll loop that
# releases the lock, so it never needs the allowlist.)
allow_indefinite_states = ["Created", "Provisioning", "Ready", "Checkpointing", "Sleeping"]

# -- State variables ----------------------------------------------------------

[[state]]
name = "name"
type = "string"
initial = ""

[[state]]
name = "description"
type = "string"
initial = ""

[[state]]
name = "provider"
type = "string"
initial = "tensorlake"

[[state]]
name = "machine_id"
type = "string"
initial = ""

[[state]]
name = "sandbox_url"
type = "string"
initial = ""

[[state]]
name = "ssh_host"
type = "string"
initial = ""

[[state]]
name = "cpu_cores"
type = "string"
initial = "2"

[[state]]
name = "memory_gb"
type = "string"
initial = "4"

[[state]]
name = "storage_gb"
type = "string"
initial = "100"

[[state]]
name = "base_image"
type = "string"
initial = "ubuntu-24.04"

[[state]]
name = "setup_script"
type = "string"
initial = ""

[[state]]
name = "last_checkpoint_at"
type = "string"
initial = ""

[[state]]
name = "provisioned_at"
type = "string"
initial = ""

[[state]]
name = "error_message"
type = "string"
initial = ""

# -- Governance fields --------------------------------------------------------

[[state]]
name = "tools_installed"
type = "string"
initial = ""

[[state]]
name = "credentials_scoped"
type = "string"
initial = ""

[[state]]
name = "network_allow"
type = "string"
initial = ""

[[state]]
name = "project_harness_id"
type = "string"
initial = ""

# The source computer's machine id this row is a live copy of (ARN-443 C). Set
# by computer_copy_start on a child at CopyStarted; empty on a source. Together
# with the Leased state and the copy's own machine_id this is the governed-child
# audit trail ("a leased copy of machine <source_machine_id>, running on
# <machine_id>") — so no separate parent_computer_id / is_copy flag is needed. The
# parent's ENTITY id, on the rare read that wants it, is derivable by query (the
# Computer whose machine_id == this source_machine_id); we do not precompute it (a
# query-per-copy loopback in the wasm would be machinery for a nicety). See
# docs/efforts/ARN-443/decisions.md C2.
[[state]]
name = "source_machine_id"
type = "string"
initial = ""

# The poll deadline (host wall-clock ms) for the async copy, stamped once by
# computer_copy_start; computer_copy_poll only reads it. A copy that never becomes
# ready by this time is torn down (CopyExpired). Real-copy path only, never DST.
[[state]]
name = "copy_deadline_at_ms"
type = "string"
initial = ""

# PROVENANCE (ARN-443 C5): true iff this row's `machine_id` is a sandbox THIS row
# acquired itself — set at ProvisionComplete (a normally-provisioned computer) or
# at CopyStarted (a child copy recording its OWN created sandbox). It stays FALSE
# while a child carries the inherited SOURCE machine_id (Created→Provisioning,
# before CopyStarted records the copy's own id). computer_terminate refuses the provider unless
# this is true, so a teardown can NEVER terminate a source's machine even as
# defense-in-depth behind the Provisioning-Destroy guard. Not in Copy's copy_fields,
# so a spawned child starts false regardless of the source's value.
[[state]]
name = "owned_machine"
type = "bool"
initial = "false"

# SOURCE-side copy lock (ARN-443 C5). The entity id of the child spawned by Copy,
# stored by the spawn effect; computer_copy_lock_poll reads that child to decide
# when to release the source's CopyInFlight lock. Empty on a non-source / idle row.
[[state]]
name = "inflight_copy_id"
type = "string"
initial = ""

# Liveness cap for the CopyInFlight lock poll (session_link idiom: the count lives
# in the spec, the module reads it). Each CopyLockPoll increments copy_lock_polls;
# past max_lock_polls the source unlocks regardless, so the lock can never wedge a
# source out of Ready even if the child row becomes unreadable. RESET to 0 on
# CopyUnlock (via reset_polls) so a second copy from the same source does not
# inherit the first's count (R2 #1).
[[state]]
name = "copy_lock_polls"
type = "counter"
initial = "0"

[[state]]
name = "max_lock_polls"
type = "string"
initial = "40"

# -- Actions -------------------------------------------------------------------

[[action]]
name = "Configure"
kind = "input"
from = ["Created"]
to = "Created"
params = ["name", "description", "provider", "cpu_cores", "memory_gb", "storage_gb", "base_image", "setup_script", "tools_installed", "credentials_scoped", "network_allow", "project_harness_id"]
hint = "Set up the computer specification before provisioning."

[[action]]
name = "Provision"
kind = "input"
from = ["Created"]
to = "Provisioning"
hint = "Start provisioning the VM."

[[action]]
name = "ProvisionComplete"
kind = "input"
from = ["Provisioning"]
to = "Ready"
params = ["machine_id", "sandbox_url", "ssh_host"]
hint = "Record the provisioned VM details."
# This row acquired its own machine — mark it owned so computer_terminate may tear
# it down. (A copy child does NOT come through here; it sets owned at CopyStarted.)
effect = [{ type = "set_bool", var = "owned_machine", value = "true" }]

[[action]]
name = "ProvisionFailed"
kind = "input"
from = ["Provisioning"]
to = "Created"
params = ["error_message"]
hint = "Record a provisioning failure."

[[action]]
name = "Checkpoint"
kind = "input"
from = ["Ready"]
to = "Checkpointing"
hint = "Start a checkpoint of the VM state."

[[action]]
name = "CheckpointComplete"
kind = "input"
from = ["Checkpointing"]
to = "Ready"
hint = "Checkpoint completed."

[[action]]
name = "Sleep"
kind = "input"
from = ["Ready"]
to = "Sleeping"
hint = "Put the VM to sleep."

[[action]]
name = "Wake"
kind = "input"
from = ["Sleeping"]
to = "Provisioning"
hint = "Wake the VM from sleep."

# Destroy → Terminating fires computer_terminate to actually tear the sandbox
# down; the module reports TerminateComplete → Destroyed.
#
# PRODUCTION-SAFETY GUARD — Provisioning is deliberately NOT a Destroy `from`
# state: while a child copy is provisioning, its machine_id field still holds the
# SOURCE's machine (carried in by the Copy spawn's copy_fields; computer_copy_start
# only overwrites it with the copy's machine at CopyStarted). If Destroy were
# allowed from Provisioning, computer_terminate would run on that source machine
# id and terminate the SOURCE's sandbox — e.g. destroying a provisioning copy of
# arni-big would kill arni-big itself. A stuck START is instead torn down via
# CopyFailed (which does NOT terminate). Once past CopyStarted (Copying/Leased)
# machine_id is the copy's own, so Destroy / CopyExpired / the lease timeout tear
# down the COPY. The e2e asserts a Provisioning child refuses Destroy.
# DEFENSE IN DEPTH (ARN-443 C5): even if a teardown reached a row carrying an
# inherited source machine, computer_terminate now calls the provider ONLY when
# owned_machine is true (set at ProvisionComplete / CopyStarted), so a source's
# machine can never be terminated through a child row.
[[action]]
name = "Destroy"
kind = "input"
from = ["Ready", "Sleeping", "Created", "Leased", "Copying"]
to = "Terminating"
hint = "Tear the VM down: fires computer_terminate on the sandbox (was a bare transition before — the VM was never actually torn down)."
effect = [{ type = "trigger", name = "computer_terminate" }]

[[action.triggers]]
name = "computer_terminate"
kind = "wasm"
module = "computer_terminate"
on_failure = "TerminateComplete"

[action.triggers.config]
tensorlake_api_key = "{secret:tensorlake_api_key}"
modal_token_id = "{secret:modal_token_id}"
modal_token_secret = "{secret:modal_token_secret}"

# computer_terminate callback. Best-effort: even if the provider terminate
# errored (on_failure also routes here), the row still reaches Destroyed — a
# leaked sandbox is caught by the panel's stale-copy reaper. Terminating is not
# in any `from` for a re-terminate, so it cannot loop.
[[action]]
name = "TerminateComplete"
kind = "input"
from = ["Terminating"]
to = "Destroyed"
hint = "Callback from computer_terminate — teardown attempted; the row is destroyed."

# -- Copy lifecycle (ARN-443 C: copies as governed children; C5: entity-serialized)

# On a SOURCE (Ready), TAKE THE COPY LOCK (Ready -> CopyInFlight) and spawn a child
# Computer that is a live copy. Because the source leaves Ready, a second Copy
# cannot fire until the lock releases — the state machine serializes copies of one
# source atomically, with no provider-list race. copy_fields carries the source's
# machine_id (the copy source) + spec into the child's ProvisionFromCopy; it does
# NOT carry `name` (an attach/resolution key — a copy named "arni-big" would
# collide with the source) nor `owned_machine` (the child must start un-owned so
# computer_terminate can never tear down the inherited source machine). The spawned
# child's id is stored in inflight_copy_id so the source can watch it.
[[action]]
name = "Copy"
kind = "input"
from = ["Ready"]
to = "CopyInFlight"
hint = "Spawn a governed child Computer that is a live copy of this one (e.g. a per-review copy of arni-big), taking the per-source copy lock."
effect = [
  { type = "spawn", entity_type = "Computer", entity_id_source = "{uuid}", initial_action = "ProvisionFromCopy", store_id_in = "inflight_copy_id", copy_fields = "machine_id,provider,cpu_cores,memory_gb,storage_gb,base_image,project_harness_id,description" },
]

# SOURCE lock-release poll: while CopyInFlight, fire CopyLockPoll every 15s.
# computer_copy_lock_poll reads the in-flight child (inflight_copy_id) and releases
# the lock (CopyUnlock -> Ready) once the child OWNS its own copy machine
# (owned_machine, i.e. discovery is done and the shared "<source>-copy" name is no
# longer ambiguous) or the child has failed / vanished; otherwise it re-arms. A
# self-loop, so it re-arms ONLY via reset_on.
[[state_timeout]]
state = "CopyInFlight"
after_seconds = 15
on_timeout = "CopyLockPoll"
reset_on = ["CopyLockPoll", "CopyLockContinue"]

[[action]]
name = "CopyLockPoll"
kind = "input"
from = ["CopyInFlight"]
to = "CopyInFlight"
hint = "Poll the in-flight copy child once (computer_copy_lock_poll). Self-loop in reset_on so each poll re-arms; increments copy_lock_polls for the liveness cap."
effect = [
  { type = "increment", var = "copy_lock_polls" },
  { type = "trigger", name = "computer_copy_lock_poll" },
]

[[action.triggers]]
name = "computer_copy_lock_poll"
kind = "wasm"
module = "computer_copy_lock_poll"
# FAIL-CLOSED (ARN-443 R2, codex #3): a module failure NEVER releases the lock —
# on_failure re-arms (CopyLockContinue) and stays in CopyInFlight. Releasing on a
# bare read error would reopen the ambiguity the lock exists to prevent (a source
# could be freed to Copy again while its first child is still discovering). The
# module itself treats a transient child-read error as "still in flight" (empty
# callback, re-arm); the ONLY releases are a DEFINITIVE child terminal/owned state
# or the bounded liveness cap (copy_lock_polls >= max_lock_polls).
on_failure = "CopyLockContinue"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

# Re-arm the lock poll after a module failure without releasing. Self-loop in
# reset_on; carries no increment so a persistently failing module re-checks every
# tick rather than tight-looping.
[[action]]
name = "CopyLockContinue"
kind = "input"
from = ["CopyInFlight"]
to = "CopyInFlight"
hint = "Re-arm the CopyInFlight lock poll after a module failure — stays locked (fail-closed); the liveness cap is the only bounded release."

# Release the source copy lock. computer_copy_lock_poll dispatches this ONLY on a
# definitive child terminal/owned state or the liveness cap; the source returns to
# Ready and may Copy again. reset_polls zeroes copy_lock_polls so the NEXT copy from
# this source starts the cap fresh (R2 #1: the counter must not carry across copies).
[[action]]
name = "CopyUnlock"
kind = "input"
from = ["CopyInFlight"]
to = "Ready"
params = ["reset_polls"]
hint = "Release the per-source copy lock — the in-flight child owns its own machine (or failed / cap); the source is free to Copy again."
effect = [{ type = "set_counter_from_param", var = "copy_lock_polls", param = "reset_polls" }]

# On the CHILD: START the copy. computer_copy_start fires the copy POST and reports
# CopyStarted ONLY on a clean 2xx that returns the copy's id (a provably-ours id — no
# name-based discovery). machine_id here is still the SOURCE's machine (from
# copy_fields) and owned_machine is false until CopyStarted records the copy's own id.
[[action]]
name = "ProvisionFromCopy"
kind = "input"
from = ["Created"]
to = "Provisioning"
params = ["machine_id", "provider", "cpu_cores", "memory_gb", "storage_gb", "base_image", "project_harness_id", "description"]
hint = "Child copy: record the source machine + inherited spec, then START the live copy."
effect = [{ type = "trigger", name = "computer_copy_start" }]

[[action.triggers]]
name = "computer_copy_start"
kind = "wasm"
module = "computer_copy_start"
# UNPROVABLE initiate results (4xx incl. 409, 5xx, gateway/read timeout, transport
# error, or a 2xx without an id) route here — retry-later. Adopting a copy we cannot
# prove we created is catastrophic (our reaper could kill another review's sandbox);
# a possibly-created copy instead leaks and is reaped by its "<source>-copy" name.
on_failure = "CopyFailed"

[action.triggers.config]
tensorlake_api_key = "{secret:tensorlake_api_key}"
modal_token_id = "{secret:modal_token_id}"
modal_token_secret = "{secret:modal_token_secret}"

# computer_copy_start callback: the copy POST returned a clean 2xx WITH the copy's id.
# machine_id / sandbox_url are now the COPY's own (from the create response);
# source_machine_id records what it was copied from; name is the child's distinct copy
# name; copy_deadline_at_ms bounds the readiness poll. owned_machine is set true here —
# the row now owns a machine the create call proved is ours, so teardown may act on it
# and the source's lock may release.
[[action]]
name = "CopyStarted"
kind = "input"
from = ["Provisioning"]
to = "Copying"
params = ["machine_id", "sandbox_url", "source_machine_id", "name", "copy_deadline_at_ms"]
hint = "Callback from computer_copy_start — the copy was created (clean 2xx with id); poll it to readiness from Copying."
effect = [{ type = "set_bool", var = "owned_machine", value = "true" }]

# The copy poll loop: while Copying, fire CopyPoll every 10s. computer_copy_poll
# health-checks the recorded copy id (CopyComplete -> Leased); past the deadline or on
# a hard failure it expires (CopyExpired). Self-loop, re-arms ONLY via reset_on.
[[state_timeout]]
state = "Copying"
after_seconds = 10
on_timeout = "CopyPoll"
reset_on = ["CopyPoll"]

[[action]]
name = "CopyPoll"
kind = "input"
from = ["Copying"]
to = "Copying"
hint = "Poll the copy once (computer_copy_poll): health-check the recorded copy id. A not-ready poll reports an empty callback (no transition) and the loop re-arms."
effect = [{ type = "trigger", name = "computer_copy_poll" }]

[[action.triggers]]
name = "computer_copy_poll"
kind = "wasm"
module = "computer_copy_poll"
on_failure = "CopyExpired"

[action.triggers.config]
tensorlake_api_key = "{secret:tensorlake_api_key}"
modal_token_id = "{secret:modal_token_id}"
modal_token_secret = "{secret:modal_token_secret}"

# computer_copy_poll callback: the copy is ready and leased. Its machine_id /
# sandbox_url / source_machine_id / name were set at CopyStarted.
[[action]]
name = "CopyComplete"
kind = "input"
from = ["Copying"]
to = "Leased"
hint = "Callback from computer_copy_poll — the copy is ready; the child is live and leased."

# CopyFailed: the INITIATE failed (still Provisioning) — machine_id is still the
# SOURCE's and owned_machine is false, so go straight to Destroyed with NO
# computer_terminate. A leaked copy is caught by the panel's reaper.
[[action]]
name = "CopyFailed"
kind = "input"
from = ["Provisioning"]
to = "Destroyed"
params = ["error_message"]
hint = "Callback from computer_copy_start — the copy could not be initiated. Straight to Destroyed with NO terminate (machine_id is still the source's here)."

# CopyExpired: the copy was never discovered or never became ready by its deadline,
# OR the poll module failed (on_failure). computer_terminate acts only on an OWNED
# machine, so this tears down a discovered copy (owned_machine true) and is a safe
# no-op before discovery (owned_machine false, machine_id still the source's).
[[action]]
name = "CopyExpired"
kind = "input"
from = ["Copying"]
to = "Terminating"
hint = "The copy never became ready — terminate the leaked copy sandbox if one was discovered (owned_machine gates the provider call)."
effect = [{ type = "trigger", name = "computer_terminate" }]

[[action.triggers]]
name = "computer_terminate"
kind = "wasm"
module = "computer_terminate"
on_failure = "TerminateComplete"

[action.triggers.config]
tensorlake_api_key = "{secret:tensorlake_api_key}"
modal_token_id = "{secret:modal_token_id}"
modal_token_secret = "{secret:modal_token_secret}"

# Keep-alive: a live user (the panel) re-enters Leased to re-arm the lease
# timeout. A copy whose owner vanished lets the lease lapse and is reaped.
[[action]]
name = "Heartbeat"
kind = "input"
from = ["Leased"]
to = "Leased"
hint = "Push the lease forward: re-entering Leased re-arms the lease state_timeout."

# Orphan reaping: a leased copy not renewed within the lease is auto-Destroyed
# (which fires computer_terminate). Only Leased has this timeout, so sources
# (Ready) are never reaped.
[[state_timeout]]
state = "Leased"
after_seconds = 3600
on_timeout = "Destroy"
# Heartbeat (a Leased self-loop) renews the lease. A self-loop re-arms a
# state_timeout ONLY when the action is in reset_on (kernel state_timeouts.rs:
# is_reset = !state_changed && reset_on.contains(action)); without this line
# Heartbeat would be a silent no-op and the lease would fire 3600s after the
# copy went live regardless of renewals. With it, each Heartbeat pushes the
# reap out another hour; a copy whose owner stops heart-beating is reaped.
reset_on = ["Heartbeat"]

# Safety: if computer_terminate never reports (host-level failure), force the row
# to Destroyed rather than hang in Terminating. TerminateComplete is idempotent.
[[state_timeout]]
state = "Terminating"
after_seconds = 300
on_timeout = "TerminateComplete"

[[invariant]]
name = "DestroyedIsFinal"
when = ["Destroyed"]
assert = "no_further_transitions"

# Seed data: Japanese learning personas
# =======================================
# Defines three curated learning paths for Japanese. Each persona specifies
# a target competency profile (which concept types at which mastery levels)
# and the corpus sources used to compute coverage.
#
# After creation, dispatch Persona.ComputeCoverage (via WASM or manually)
# to calculate how well the knowledge bank covers the persona's target,
# then Persona.Publish to make it available for learner assignment.

# =========================================================================
# Light Novel Reader — JLPT N3 equivalent
# =========================================================================
# Can read typical isekai/fantasy light novels with occasional dictionary
# lookups. Strong recognition and contextual use of narrative vocabulary,
# moderate production skills. Comfortable with informal written Japanese.

[[instance]]
type = "Persona"
fields = { Name = "Light Novel Reader", Domain = "japanese", Description = "Read light novels in Japanese with occasional dictionary lookups. Targets JLPT N3-equivalent comprehension with emphasis on written narrative vocabulary, common kanji, and grammar patterns found in popular fiction. Prioritizes recognition and contextual understanding over production.", TargetProfile = '''
{
  "vocab": {
    "total": 5000,
    "distribution": {
      "N5": { "count": 800, "required_mastery": "Proficient" },
      "N4": { "count": 1500, "required_mastery": "Proficient" },
      "N3": { "count": 2000, "required_mastery": "Developing" },
      "genre_specific": { "count": 700, "required_mastery": "Introduced", "source_filter": "light_novel_frequency" }
    },
    "dimension_weights": {
      "recognition": 0.40,
      "production": 0.10,
      "contextual_use": 0.35,
      "transfer": 0.15
    }
  },
  "kanji": {
    "total": 800,
    "distribution": {
      "grade_1_3": { "count": 440, "required_mastery": "Proficient" },
      "grade_4_6": { "count": 260, "required_mastery": "Developing" },
      "secondary_common": { "count": 100, "required_mastery": "Introduced" }
    },
    "dimension_weights": {
      "recognition": 0.50,
      "production": 0.10,
      "contextual_use": 0.30,
      "transfer": 0.10
    }
  },
  "grammar": {
    "total": 150,
    "distribution": {
      "N5": { "count": 55, "required_mastery": "Mastered" },
      "N4": { "count": 50, "required_mastery": "Proficient" },
      "N3": { "count": 45, "required_mastery": "Developing" }
    },
    "dimension_weights": {
      "recognition": 0.35,
      "production": 0.15,
      "contextual_use": 0.35,
      "transfer": 0.15
    }
  }
}
''', CorpusSources = '''
[
  "jlpt_vocabulary",
  "joyo_kanji",
  "grammar_points",
  "light_novel_frequency"
]
''' }

[[instance.actions]]
name = "Define"
params = { name = "Light Novel Reader", description = "Read light novels in Japanese with occasional dictionary lookups. Targets JLPT N3-equivalent comprehension with emphasis on written narrative vocabulary, common kanji, and grammar patterns found in popular fiction. Prioritizes recognition and contextual understanding over production.", domain = "japanese" }


type = "Persona"
fields = { Name = "Business Conversation", Domain = "japanese", Description = "Participate in Japanese business meetings, write formal emails, and navigate keigo (honorific and humble speech patterns). Targets JLPT N2-equivalent proficiency with domain-weighted vocabulary emphasizing professional and business contexts. Prioritizes production and contextual use for real-time conversational competency.", TargetProfile = '''

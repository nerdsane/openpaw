# WorkCycle — Governed implementation loop for one planned change.

[automaton]
name = "WorkCycle"
states = ["Planning", "Planned", "InProgress", "Testing", "Reviewing", "Complete", "Failed"]
initial = "Planning"

[[state]]
name = "harness_id"
type = "string"
initial = ""

[[state]]
name = "task_summary"
type = "string"
initial = ""

[[state]]
name = "planner_id"
type = "string"
initial = ""

[[state]]
name = "approver_id"
type = "string"
initial = ""

[[state]]
name = "plan_summary"
type = "string"
initial = ""

[[state]]
name = "test_summary"
type = "string"
initial = ""

[[state]]
name = "pr_url"
type = "string"
initial = ""

[[state]]
name = "error_message"
type = "string"
initial = ""

[[state]]
name = "has_plan"
type = "bool"
initial = "false"

[[state]]
name = "tests_passed"
type = "bool"
initial = "false"

# --- Gate fields (bool for is_true guards) ---

[[state]]
name = "migrations_ok"
type = "bool"
initial = "false"

[[state]]
name = "typecheck_ok"
type = "bool"
initial = "false"

[[state]]
name = "unit_tests_ok"
type = "bool"
initial = "false"

[[state]]
name = "dst_ok"
type = "bool"
initial = "false"

[[state]]
name = "policy_gates_ok"
type = "bool"
initial = "false"

[[state]]
name = "e2e_ok"
type = "bool"
initial = "false"

[[state]]
name = "review_notes"
type = "string"
initial = ""

[[state]]
name = "sandbox_url"
type = "string"
initial = ""

[[action]]
name = "Configure"
kind = "input"
from = ["Planning"]
params = ["harness_id", "task_summary", "planner_id"]
hint = "Attach the work cycle to a harness and identify the planner for the change."

[[action]]
name = "WritePlan"
kind = "input"
from = ["Planning"]
to = "Planned"
params = ["plan_summary", "planner_id"]
effect = "set has_plan true"
hint = "Draft the plan before implementation can begin."

[[action]]
name = "StartWork"
kind = "input"
from = ["Planned"]
to = "InProgress"
guard = "is_true has_plan"
hint = "Start implementation only after a plan exists."

[[action]]
name = "ReportMigrations"
kind = "input"
from = ["InProgress"]
effect = "set migrations_ok true"
hint = "Self-loop: record that migrations passed."

[[action]]
name = "ReportTypecheck"
kind = "input"
from = ["InProgress"]
effect = "set typecheck_ok true"
hint = "Self-loop: record that typechecking passed."

[[action]]
name = "ReportUnitTests"
kind = "input"
from = ["InProgress"]
effect = "set unit_tests_ok true"
hint = "Self-loop: record that unit tests passed."

[[action]]
name = "ReportDst"
kind = "input"
from = ["InProgress", "Testing"]
effect = "set dst_ok true"
hint = "Record that DST checks passed. Allowed in InProgress or Testing."

[[action]]
name = "ReportPolicyGates"
kind = "input"
from = ["InProgress", "Testing"]
effect = "set policy_gates_ok true"
hint = "Record that policy gates passed. Allowed in InProgress or Testing."

[[action]]
name = "ReportE2e"
kind = "input"
from = ["InProgress", "Testing"]
effect = "set e2e_ok true"
hint = "Record that end-to-end tests passed. Allowed in InProgress or Testing."

[[action]]
name = "UpdateSandbox"
kind = "input"
from = ["InProgress"]
params = ["sandbox_url"]
hint = "Record the sandbox URL of the SWE agent working on this cycle."

[[action]]
name = "BeginTesting"
kind = "input"
from = ["InProgress"]
to = "Testing"
guard = [
  { type = "is_true", var = "migrations_ok" },
  { type = "is_true", var = "typecheck_ok" },
  { type = "is_true", var = "unit_tests_ok" }
]
hint = "Move implementation into test execution. Requires migrations, typecheck, and unit tests to pass."

[[action]]
name = "PassTests"
kind = "input"
from = ["Testing"]
to = "Reviewing"
params = ["test_summary"]
effect = "set tests_passed true"
guard = [
  { type = "is_true", var = "dst_ok" },
  { type = "is_true", var = "policy_gates_ok" }
]
hint = "Only passing work should enter review. Requires DST and policy gates to pass."

[[action]]
name = "Approve"
kind = "input"
from = ["Reviewing"]
to = "Complete"
guard = "is_true tests_passed"
params = ["approver_id", "pr_url"]
hint = "Approve the reviewed change after tests have passed."

[[action]]
name = "RequestChanges"
kind = "input"
from = ["Reviewing"]
to = "InProgress"
params = ["review_notes"]
effect = "set tests_passed false"
hint = "Send work back for changes. Resets tests_passed; other gate booleans are re-verified by gate_verifier on the next BeginTesting attempt."

[[action]]
name = "Fail"
kind = "input"
from = ["Planning", "Planned", "InProgress", "Testing", "Reviewing"]
to = "Failed"
params = ["error_message"]
hint = "Record a failed work cycle with the reason for failure."

[[invariant]]
name = "PlannedWorkHasPlan"
when = ["Planned", "InProgress", "Testing", "Reviewing", "Complete"]
assert = "has_plan"

[[invariant]]
name = "ReviewedWorkPassedTests"
when = ["Reviewing", "Complete"]
assert = "tests_passed"

[[invariant]]
name = "CompleteIsFinal"
when = ["Complete"]
assert = "no_further_transitions"

[[invariant]]
name = "FailedIsFinal"
when = ["Failed"]
assert = "no_further_transitions"

# --- Integrations ---
# Gate verification and reviewer spawning are PROJECT-SPECIFIC, not platform.
# Each project's reference config (e.g. projects/deep-sci-fi/) defines its own
# gate_verifier WASM and reviewer agent configuration.
# The WorkCycle spec provides the state machine and actions; projects wire
# their own integrations via the entity configuration at runtime.

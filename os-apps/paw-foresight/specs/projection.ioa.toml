# Projection — Temporal simulation that advances through adaptive time steps.
#
# A projection simulates a domain's future by stepping through a schedule of
# day offsets. At each step, probe agents observe the projected state and record
# observations. Projections can branch to explore alternative futures.
#
# The step loop is orchestrator-driven (hybrid architecture, ADR-002):
#   Start → (spawn_orchestrator) → creates orchestrator session with skill
#   → Orchestrator runs the full loop using temper.* API calls:
#     spawn probes → wait → read observations → converge → write state →
#     dispatch ProbeStepDone/ConvergenceComplete/ProjectionUpdated/AdvanceStep
#     for audit trail → repeat → Complete
#   Entity actions below are dispatched by the orchestrator for state tracking.

[automaton]
name = "Projection"
states = ["Created", "Running", "Complete", "Branched", "Failed"]
initial = "Created"

# --- State Variables ---

[[state]]
name = "foresight_model_id"
type = "string"
initial = ""

[[state]]
name = "horizon"
type = "string"
initial = ""

[[state]]
name = "current_step"
type = "counter"
initial = "0"

[[state]]
name = "max_steps"
type = "string"
initial = ""

[[state]]
name = "step_schedule"
type = "string"
initial = "[]"

[[state]]
name = "projected_state_file_id"
type = "string"
initial = ""

[[state]]
name = "parent_projection_id"
type = "string"
initial = ""

[[state]]
name = "branch_reason"
type = "string"
initial = ""

[[state]]
name = "probe_config"
type = "string"
initial = ""

[[state]]
name = "probe_agent_ids"
type = "string"
initial = "[]"

[[state]]
name = "observation_count"
type = "counter"
initial = "0"

[[state]]
name = "direction_count"
type = "counter"
initial = "0"

[[state]]
name = "error_message"
type = "string"
initial = ""

# --- Actions ---

[[action]]
name = "Configure"
kind = "input"
from = ["Created"]
params = ["foresight_model_id", "horizon", "max_steps", "step_schedule", "probe_config", "parent_projection_id", "branch_reason"]
hint = "Configure projection parameters. Self-loop on Created."

[[action]]
name = "Start"
kind = "input"
from = ["Created"]
to = "Running"
params = []
hint = "Begin the projection. Spawns an orchestrator session that runs the full loop."
effect = [{ type = "trigger", name = "spawn_orchestrator" }]

[[action]]
name = "ProbesReady"
kind = "input"
from = ["Running"]
params = ["probe_agent_ids"]
hint = "Callback after probe agents are spawned. Records agent IDs. Chain pauses until ProbeStepDone events arrive."

[[action]]
name = "ProbeStepDone"
kind = "input"
from = ["Running"]
params = ["probe_agent_id", "direction_id"]
hint = "A Probe self-reports completion of the current step. Dispatched by orchestrator for audit trail."

[[action]]
name = "ConvergenceComplete"
kind = "input"
from = ["Running"]
params = []
hint = "Convergence analysis finished. Dispatched by orchestrator for audit trail."

[[action]]
name = "ProjectionUpdated"
kind = "input"
from = ["Running"]
params = ["projected_state_file_id"]
hint = "Projected state evolved. Dispatched by orchestrator with new file ID for audit trail."

[[action]]
name = "AdvanceStep"
kind = "internal"
from = ["Running"]
params = []
hint = "Advance to next step: increment counter. Dispatched by orchestrator between steps."
effect = [
  { type = "increment", var = "current_step" },
]

[[action]]
name = "Complete"
kind = "input"
from = ["Running"]
to = "Complete"
params = []
hint = "All steps finished. Mark the projection as complete."

[[action]]
name = "Branch"
kind = "input"
from = ["Running"]
to = "Branched"
params = []
hint = "Mark this projection as branched. A child projection continues from this point."

[[action]]
name = "Fail"
kind = "input"
from = ["Created", "Running"]
to = "Failed"
params = ["error_message"]
hint = "Mark projection as failed due to an unrecoverable error."

# --- Invariants ---

[[invariant]]
name = "CompleteIsFinal"
when = ["Complete"]
assert = "no_further_transitions"

[[invariant]]
name = "BranchedIsFinal"
when = ["Branched"]
assert = "no_further_transitions"

[[invariant]]
name = "FailedIsFinal"
when = ["Failed"]
assert = "no_further_transitions"

# --- Integrations ---

[[integration]]
name = "spawn_orchestrator"
trigger = "spawn_orchestrator"
type = "wasm"
module = "spawn_orchestrator"
on_failure = "Fail"

[integration.config]
temper_api_url = "{secret:temper_api_url}"

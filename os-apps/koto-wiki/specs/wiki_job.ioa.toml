# WikiJob -- Task queue entry for the Curator agent.
#
# Jobs represent discrete units of work: source searches, page synthesis,
# lint passes, and revision tasks. Seed data creates initial jobs; the
# Curator picks them up, runs them, and records outcomes.
#
# Lifecycle: Queued -> Ready -> Running -> Completed | Failed
#
# Submit triggers the build_session_message WASM which constructs a
# domain-specific prompt and spawns a Curator agent session.

[automaton]
name = "WikiJob"
states = ["Queued", "Ready", "Running", "Completed", "Failed"]
initial = "Queued"

# Job classification: source_search, synthesize, lint, revise
[[state]]
name = "job_type"
type = "string"
initial = ""

# Which persona's wiki this job operates on
[[state]]
name = "persona_id"
type = "string"
initial = ""

# JSON: what to do (search queries, source IDs, page IDs, scope, etc.)
[[state]]
name = "input"
type = "string"
initial = "{}"

# JSON: what happened (pages created, issues found, sources indexed, etc.)
[[state]]
name = "output"
type = "string"
initial = "{}"

# JSON array of incremental progress entries
[[state]]
name = "progress_log"
type = "string"
initial = "[]"

# Error details if job failed
[[state]]
name = "error_message"
type = "string"
initial = ""

# --- Session spawning fields ---

# Soul to use for the agent session
[[state]]
name = "soul_id"
type = "string"
initial = "app-soul-curator"

# LLM model identifier
[[state]]
name = "model"
type = "string"
initial = "gpt-5"

# LLM provider
[[state]]
name = "provider"
type = "string"
initial = "openai"

# Comma-separated tool list for the session
[[state]]
name = "tools_enabled"
type = "string"
initial = "temper_get,temper_list,temper_create,temper_action,temper_write,temper_read,temper_web_search,temper_web_fetch"

# Maximum conversation turns
[[state]]
name = "max_turns"
type = "string"
initial = "250"

# Constructed prompt for the session (built by WASM)
[[state]]
name = "user_message"
type = "string"
initial = ""

# ID of the spawned agent session
[[state]]
name = "session_id"
type = "string"
initial = ""

# --- Queued ---

[[action]]
name = "Configure"
kind = "input"
from = ["Queued"]
params = ["job_type", "persona_id", "input"]
hint = "Set or update job parameters before execution."

[[action]]
name = "Submit"
kind = "input"
from = ["Queued"]
to = "Ready"
hint = "Validate and prepare job for execution. Triggers message builder WASM."
effect = [{ type = "trigger", name = "build_session_message" }]

[[action]]
name = "Start"
kind = "input"
from = ["Queued"]
to = "Running"
params = []
hint = "Begin executing this job (direct start without session spawning)."

# --- Ready (session spawned, waiting for confirmation) ---

[[action]]
name = "SessionSpawned"
kind = "input"
from = ["Ready"]
to = "Running"
params = ["session_id"]
hint = "Session has been created and is running."

# --- Running ---

[[action]]
name = "RecordProgress"
kind = "input"
from = ["Running"]
params = ["progress_log"]
hint = "Append incremental progress entries during execution."

[[action]]
name = "Complete"
kind = "input"
from = ["Running"]
to = "Completed"
params = ["output"]
hint = "Mark job as successfully completed with output summary."

[[action]]
name = "Fail"
kind = "input"
from = ["Ready", "Running"]
to = "Failed"
params = ["error_message"]
hint = "Mark job as failed with error details."

# --- Invariants ---

[[invariant]]
name = "CompletedIsFinal"
when = ["Completed"]
assert = "no_further_transitions"

[[invariant]]
name = "FailedIsFinal"
when = ["Failed"]
assert = "no_further_transitions"

# --- Integrations ---

[[integration]]
name = "build_session_message"
trigger = "build_session_message"
type = "wasm"
module = "build_session_message"
on_failure = "Fail"

[integration.config]
temper_api_url = "{secret:temper_api_url}"

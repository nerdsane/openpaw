# WikiPage -- Synthesized, versioned knowledge article.
#
# Pages are scoped to a persona and linked to koto-learn Concepts via
# concept_ids. Content lives in paw-fs (referenced by file_id); the entity
# holds metadata, summary, cross-references, and linkage for OData queries.
#
# Lifecycle: Drafting -> Published <-> Revising -> Archived
#
# The version counter increments on each Publish/Republish. Archiving is
# terminal and requires human approval (enforced by Cedar policy).
#
# No WASM integrations; the Curator agent dispatches all actions directly.

[automaton]
name = "WikiPage"
states = ["Drafting", "Published", "Revising", "Archived"]
initial = "Drafting"

# Which persona's wiki
[[state]]
name = "persona_id"
type = "string"
initial = ""

# Stable, human-readable identifier for cross-refs and paw-fs path
[[state]]
name = "slug"
type = "string"
initial = ""

# Page title
[[state]]
name = "title"
type = "string"
initial = ""

# Organizational category (grammar, vocabulary, cultural-context, etc.)
[[state]]
name = "category"
type = "string"
initial = ""

# paw-fs File GUID pointing to full markdown content
[[state]]
name = "file_id"
type = "string"
initial = ""

# 1-3 sentence abstract for LLM context injection
[[state]]
name = "summary"
type = "string"
initial = ""

# JSON array of koto-learn Concept IDs for mastery tracking
[[state]]
name = "concept_ids"
type = "string"
initial = "[]"

# JSON array of cross-references: [{ page_id, slug, relationship }]
[[state]]
name = "cross_references"
type = "string"
initial = "[]"

# JSON array of WikiSource IDs that contributed to this page
[[state]]
name = "source_ids"
type = "string"
initial = "[]"

# JSON array of freeform tags
[[state]]
name = "tags"
type = "string"
initial = "[]"

# Domain-neutral difficulty band: JSON { floor, ceiling }
[[state]]
name = "difficulty_range"
type = "string"
initial = "{}"

# Increments on each Publish/Republish
[[state]]
name = "version"
type = "counter"
initial = 0

# Why this revision was initiated
[[state]]
name = "revision_rationale"
type = "string"
initial = ""

# JSON object with last lint results
[[state]]
name = "lint_status"
type = "string"
initial = "{}"

# --- Drafting ---

[[action]]
name = "Draft"
kind = "input"
from = ["Drafting"]
params = ["persona_id", "slug", "title", "category", "file_id", "summary", "concept_ids", "cross_references", "source_ids", "tags", "difficulty_range"]
hint = "Populate or refine page fields during drafting."

[[action]]
name = "Publish"
kind = "input"
from = ["Drafting"]
to = "Published"
params = []
hint = "Publish the draft. Increments version counter."
effect = [{ type = "increment", field = "version" }]

# --- Published ---

[[action]]
name = "UpdateLintStatus"
kind = "input"
from = ["Published"]
params = ["lint_status"]
hint = "Record lint results without changing page state."

[[action]]
name = "BeginRevision"
kind = "input"
from = ["Published"]
to = "Revising"
params = ["revision_rationale"]
hint = "Pull a published page back into revision with a stated rationale."

[[action]]
name = "Archive"
kind = "input"
from = ["Published"]
to = "Archived"
params = []
hint = "Archive a published page. Terminal state. Requires human approval via Cedar."

# --- Revising ---

[[action]]
name = "Revise"
kind = "input"
from = ["Revising"]
params = ["file_id", "summary", "concept_ids", "cross_references", "source_ids", "tags", "difficulty_range"]
hint = "Update page content and metadata during revision."

[[action]]
name = "Republish"
kind = "input"
from = ["Revising"]
to = "Published"
params = []
hint = "Republish revised page. Increments version counter."
effect = [{ type = "increment", field = "version" }]

# --- Invariants ---

[[invariant]]
name = "ArchivedIsFinal"
when = ["Archived"]
assert = "no_further_transitions"
